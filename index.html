<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rickボンバー</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    position: fixed;
    top: 0; left: 0;
    background: linear-gradient(160deg,#1b2a4a,#0d1524);
    color: #fff;
    font-family: 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    padding: 6px;
  }
  h1 {
    font-size: 17px;
    margin: 4px 0;
    letter-spacing: 1px;
    text-shadow: 0 2px 4px rgba(0,0,0,.5);
  }
  #skipToBossBtn, #skipToFirstBossBtn {
    display: inline-block;
  }
  #muteBtn {
    position: fixed;
    top: 8px;
    right: 8px;
    z-index: 50;
    cursor: pointer;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.12);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s;
    padding: 0;
    touch-action: none;
  }
  #muteBtn:active { transform: scale(1.2); }
  #skipToPortalBtn {
    display: none;
  }
  #hud {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 5px 10px;
    font-size: 12px;
    margin-bottom: 6px;
    background: rgba(255,255,255,0.08);
    padding: 5px 10px;
    border-radius: 14px;
    max-width: 92vw;
  }
  #hud > div { white-space: nowrap; }
  #hud span.val { font-weight: bold; color: #ffce6b; }
  #stage {
    position: relative;
    line-height: 0;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,.5), 0 0 0 4px #3a2b1a, 0 0 0 8px #5a3d20;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    max-width: 92vw;
    max-height: 42vh;
    image-rendering: pixelated;
    background: #2f5233;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    z-index: 60;
    background: rgba(0,0,0,.72);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 16px;
    box-sizing: border-box;
    overflow-y: auto;
  }
  #overlay.show { display: flex; }
  #whiteFlash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
    z-index: 40;
  }
  #bossBanner {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    background: rgba(60,0,0,0.35);
  }
  #bossBanner.show { display: flex; }
  #bossBanner span {
    font-size: 22px;
    font-weight: bold;
    color: #ff5a5a;
    text-shadow: 0 0 10px rgba(255,0,0,0.9), 0 2px 4px rgba(0,0,0,.6);
    animation: bossPulse 0.6s ease-in-out infinite alternate;
  }
  @keyframes bossPulse {
    from { transform: scale(1); }
    to { transform: scale(1.15); }
  }
  #itemToast {
    position: absolute;
    left: 50%;
    top: 24%;
    transform: translate(-50%, 0);
    padding: 5px 14px;
    background: rgba(0,0,0,0.55);
    border-radius: 8px;
    color: #ffe066;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 0 6px rgba(255,224,102,0.8), 0 1px 3px rgba(0,0,0,.7);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.4s ease;
    z-index: 41;
  }
  #itemToast.show { opacity: 1; transform: translate(-50%, -6px); }
  #overlay h2 { margin: 0; font-size: 24px; line-height: 1.3; }
  #overlayText { margin: 0; opacity: .85; font-size: 13px; line-height: 1.5; max-width: 280px; }
  #restartHint { margin: 2px 0 0; opacity: .55; font-size: 10.5px; }
  button.bigbtn {
    padding: 10px 22px;
    font-size: 15px;
    border: none;
    border-radius: 24px;
    background: linear-gradient(180deg,#ff8a3d,#e85d1f);
    color: #fff;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,.4);
    touch-action: none;
  }
  #controls {
    margin-top: 8px;
    width: 100%;
    max-width: 500px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex: 1;
    padding: 0 6px;
  }
  #joyBase {
    position: relative;
    width: 128px;
    height: 128px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.16), rgba(255,255,255,0.05) 70%);
    border: 2px solid rgba(255,255,255,0.25);
    touch-action: none;
    flex-shrink: 0;
  }
  #joyKnob {
    position: absolute;
    top: 50%; left: 50%;
    width: 58px; height: 58px;
    margin-left: -29px; margin-top: -29px;
    border-radius: 50%;
    background: linear-gradient(180deg,#5fa8ff,#2f6fe0);
    box-shadow: 0 4px 10px rgba(0,0,0,.5);
    pointer-events: none;
  }
  #bombBtn {
    width: 104px; height: 104px;
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 35% 30%, #666,#111 70%);
    color: #ffb347;
    font-size: 15px;
    font-weight: bold;
    box-shadow: 0 4px 12px rgba(0,0,0,.5), inset 0 0 0 3px #333;
    touch-action: none;
    flex-shrink: 0;
  }
  #bombBtn:active { transform: scale(0.94); }
  #actionBtns {
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
  }
  #invincibleBtn {
    width: 58px; height: 58px;
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 35% 30%, #ffe066, #d4a017 70%);
    color: #3a2a00;
    font-size: 10.5px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,.5), inset 0 0 0 3px #a97a0f;
    touch-action: none;
  }
  #invincibleBtn:active { transform: scale(0.94); }
  #invincibleBtn:disabled {
    background: radial-gradient(circle at 35% 30%, #777, #444 70%);
    color: #aaa;
    box-shadow: 0 4px 10px rgba(0,0,0,.5), inset 0 0 0 3px #333;
  }
  #smallBtnRow {
    display: flex;
    flex-direction: row;
    gap: 14px;
    align-items: center;
  }
  #destroyRayBtn {
    width: 58px; height: 58px;
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 35% 30%, #ff6b6b, #a01818 70%);
    color: #fff;
    font-size: 10.5px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,.5), inset 0 0 0 3px #7a1414;
    touch-action: none;
  }
  #destroyRayBtn:active { transform: scale(0.94); }
  #destroyRayBtn:disabled {
    background: radial-gradient(circle at 35% 30%, #777, #444 70%);
    color: #aaa;
    box-shadow: 0 4px 10px rgba(0,0,0,.5), inset 0 0 0 3px #333;
  }
  #hint { font-size: 10.5px; opacity: .6; margin-top: 4px; text-align:center; }
  #titleScreen {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: radial-gradient(circle at 50% 28%, #1b2a4a, #05070f 78%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #titlePanel, #storyPanel { max-width: 340px; text-align: center; color: #eee; }
  #titleLogo {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 1px;
    margin: 0 0 16px;
    text-shadow: 0 2px 8px rgba(0,0,0,.7), 0 0 16px rgba(255,180,70,.35);
  }
  #titleTagline {
    font-size: 12.5px;
    line-height: 1.75;
    opacity: .82;
    margin: 0 0 28px;
  }
  .storyLine {
    font-size: 14.5px;
    line-height: 1.8;
    margin: 0 0 16px;
    opacity: 0;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
    animation: storyFadeIn 0.7s ease forwards;
  }
  .storyLine:nth-child(1){ animation-delay: 0.1s; }
  .storyLine:nth-child(2){ animation-delay: 1.0s; }
  .storyLine:nth-child(3){ animation-delay: 1.9s; }
  @keyframes storyFadeIn { from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  #storyContinueBtn { margin-top: 12px; opacity: 0; animation: storyFadeIn 0.7s ease forwards; animation-delay: 2.7s; }
</style>
</head>
<body>
<div id="titleScreen">
  <div id="titlePanel">
    <h1 id="titleLogo">🤖 Rickボンバー</h1>
    <p id="titleTagline">主人公は地球を守るロボット。<br>ハッキングされ暴走した仲間を倒し、諸悪の根源である地球外生命体と戦う——。</p>
    <button class="bigbtn" id="startGameBtn">はじめる</button>
  </div>
  <div id="storyPanel" style="display:none;">
    <p class="storyLine">仲間たちが、暴走している…!?</p>
    <p class="storyLine">まさか、内部プログラムをハッキングされたのか…!?</p>
    <p class="storyLine">一刻も早く犯人を突き止め、この手で止めなければ——</p>
    <button class="bigbtn" id="storyContinueBtn">ステージ開始</button>
  </div>
</div>
<div id="app">
  <h1><span id="skipToFirstBossBtn" title="最初のボスへスキップ">💣</span> Rickボンバー <span id="skipToBossBtn" title="真のラスボスへスキップ">💣</span></h1>
  <button id="muteBtn" title="サウンドON/OFF">🔊</button>
  <button id="skipToPortalBtn" title="ワープゾーンへスキップ">🤖</button>
  <div id="hud">
    <div>タイム <span class="val" id="elapsedTime">0:00.0</span></div>
    <div>敵 <span class="val" id="enemyCount">0</span></div>
    <div>爆弾 <span class="val" id="bombCount">3/3</span></div>
    <div>火力 <span class="val" id="fireStat">2</span></div>
    <div>速度 <span class="val" id="speedStat">1</span></div>
    <div>キック <span class="val" id="kickStat">○</span></div>
  </div>
  <div id="stage">
    <canvas id="game" width="480" height="352"></canvas>
    <div id="bossBanner"><span>⚠️ ボス登場 ⚠️</span></div>
    <div id="itemToast"></div>
    <div id="whiteFlash"></div>
    <div id="overlay">
      <h2 id="overlayTitle">GAME OVER</h2>
      <p id="overlayText">もう一度挑戦しよう！</p>
      <button class="bigbtn" id="screenshotBtn">📸 スクリーンショット</button>
      <button class="bigbtn" id="restartBtn">リスタート</button>
      <p id="restartHint">PC: スペースキーでもリスタートできます</p>
    </div>
  </div>
  <div id="controls">
    <div id="joyBase">
      <div id="joyKnob"></div>
    </div>
    <div id="actionBtns">
      <button id="bombBtn">爆弾<br>設置</button>
      <div id="smallBtnRow">
        <button id="destroyRayBtn" style="display:none;">破壊光線<br>1回のみ</button>
        <button id="invincibleBtn">無敵<br>5秒</button>
      </div>
    </div>
  </div>
  <div id="hint"></div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const COLS = 15, ROWS = 11, TILE = 32;
  const canvas = document.getElementById('game');
  canvas.width = 480;
  canvas.height = 352;

  // ---------- 3D scene setup (Three.js) ----------
  // The whole board is mapped into a small 3D world: each grid cell (gx,gy)
  // sits at world position (gx - COLS/2 + 0.5, *, gy - ROWS/2 + 0.5). A
  // pixel-based position px (as used throughout the existing 2D game logic,
  // where a tile's center pixel is gx*TILE+TILE/2) converts the same way by
  // dividing by TILE first - so both grid cells and continuously-moving
  // entities share one consistent conversion.
  function pixelToWorld(px, py){
    return { x: px/TILE - COLS/2, z: py/TILE - ROWS/2 };
  }
  function cellCenterToWorld(gx, gy){
    return pixelToWorld(gx*TILE+TILE/2, gy*TILE+TILE/2);
  }
  // converts the player's last-input-direction string into the same
  // atan2(dx,dy) angle space used for every other entity's facing
  function facingStringToAngle(f){
    if(f==='up') return Math.PI;
    if(f==='left') return -Math.PI/2;
    if(f==='right') return Math.PI/2;
    return 0; // 'down' (the default)
  }

  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, preserveDrawingBuffer:true });
  renderer.setSize(canvas.width, canvas.height, false);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x8fd0ea, 0.018);

  const camera = new THREE.PerspectiveCamera(35, canvas.width/canvas.height, 0.1, 100);
  camera.position.set(0, 19.5, 2.6);
  camera.lookAt(0, 0, 0);

  // bright, warm daylight-style lighting for a clear, readable look
  scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x3d6b41, 1.05));
  const keyLight = new THREE.DirectionalLight(0xfff4d6, 0.85);
  keyLight.position.set(5, 12, 6);
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0xcfe8ff, 0.35);
  fillLight.position.set(-6, 6, -4);
  scene.add(fillLight);
  scene.add(new THREE.AmbientLight(0xffffff, 0.25));

  // reusable geometries/materials (shared across many mesh instances so we
  // aren't allocating new GPU buffers every frame)
  const geo = {
    box: new THREE.BoxGeometry(1,1,1),
    sphere: new THREE.SphereGeometry(0.5, 12, 10),
    icosa: new THREE.IcosahedronGeometry(0.5, 0),
    cylinder: new THREE.CylinderGeometry(0.5,0.5,1,10),
    plane: new THREE.PlaneGeometry(1,1),
    torus: new THREE.TorusGeometry(0.42, 0.07, 8, 20),
    ring: new THREE.RingGeometry(0.5, 0.62, 24),
  };
  const boxEdges = new THREE.EdgesGeometry(geo.box);
  function addGlowEdges(mesh, colorHex, opacity){
    // a soft dark cel-shaded outline (rather than a neon glow) so shapes
    // stay crisp and readable against the bright daytime scene
    const line = new THREE.LineSegments(boxEdges, new THREE.LineBasicMaterial({
      color: 0x1a1a1a, transparent: true, opacity: (opacity===undefined?0.9:opacity)*0.55
    }));
    mesh.add(line);
    return line;
  }
  function stdMat(color, emissive, opts){
    opts = opts || {};
    return new THREE.MeshStandardMaterial(Object.assign({
      color, emissive: emissive!==undefined?emissive:0x000000,
      roughness: 0.5, metalness: 0.4
    }, opts));
  }
  function basicMat(color, opts){
    return new THREE.MeshBasicMaterial(Object.assign({ color }, opts));
  }
  const mat = {
    floorA: stdMat(0x3d6b41, 0x0a1a0a, {roughness:0.85, metalness:0.05}),
    floorB: stdMat(0x356038, 0x081408, {roughness:0.85, metalness:0.05}),
    wall: stdMat(0x7a7a7a, 0x000000, {roughness:0.6, metalness:0.35}),
    wallPanel: stdMat(0x5c5c5c, 0x000000, {roughness:0.55, metalness:0.4}),
    wallRivet: stdMat(0x2a2a2a, 0x000000, {roughness:0.3, metalness:0.8}),
    wallTrim: basicMat(0xdadada, {transparent:true, opacity:0.9}),
    block: stdMat(0xa5682f, 0x140800, {roughness:0.7, metalness:0.1}),
    blockPlank: stdMat(0x8a5324, 0x0a0400, {roughness:0.75, metalness:0.05}),
    blockBolt: stdMat(0x4a2f14, 0x000000, {roughness:0.5, metalness:0.3}),
    blockTrim: basicMat(0xf0c080, {transparent:true, opacity:0.95}),
    playerBody: stdMat(0x3d7bff, 0x0a1a44, {metalness:0.55, roughness:0.35}),
    playerVisor: basicMat(0xffffff),
    enemyBody: stdMat(0xe64545, 0x2a0a0a, {metalness:0.55, roughness:0.35}),
    enemyVisor: basicMat(0xffe4e4),
    bossBody: stdMat(0x1fa8a0, 0x0a2c2a, {metalness:0.6, roughness:0.3}),
    trueBossBody: stdMat(0x222222, 0x0a0a0a, {metalness:0.7, roughness:0.25}),
    trueBossVisor: basicMat(0xff3b3b),
    trueBossBomb: stdMat(0x3a0f0f, 0x1a0000, {metalness:0.5, roughness:0.4}),
    bossEye: basicMat(0xffe4e4),
    bomb: stdMat(0x222222, 0x000000, {metalness:0.5, roughness:0.4}),
    bombRingP: basicMat(0xdddddd),
    bombRingT: basicMat(0xff4d4d),
    item: basicMat(0xffd54f),
    explosionInner: basicMat(0xffe680, {transparent:true}),
    explosionOuter: basicMat(0xff9a30, {transparent:true}),
    projectile: basicMat(0xffcf4d),
    debrisMetal: basicMat(0xffaa28),
    debrisSpark: basicMat(0xa5682f),
    deathParticle: basicMat(0xffffff, {transparent:true}),
  };

  // static board (floor + walls + blocks); rebuilt whenever the grid layout
  // changes (new game, or a boss clears all blocks) and individual tiles are
  // removed one at a time as they get destroyed by an explosion
  // ---------- procedural textures (glow sprites, floor circuit pattern, sky) ----------
  function makeGlowTexture(){
    const cvs = document.createElement('canvas');
    cvs.width = cvs.height = 64;
    const c2 = cvs.getContext('2d');
    const grad = c2.createRadialGradient(32,32,0,32,32,32);
    grad.addColorStop(0,'rgba(255,255,255,1)');
    grad.addColorStop(0.35,'rgba(255,255,255,0.55)');
    grad.addColorStop(1,'rgba(255,255,255,0)');
    c2.fillStyle = grad;
    c2.fillRect(0,0,64,64);
    return new THREE.CanvasTexture(cvs);
  }
  const glowTexture = makeGlowTexture();

  function makeEmojiTexture(emoji){
    const cvs = document.createElement('canvas');
    cvs.width = cvs.height = 128;
    const c2 = cvs.getContext('2d');
    c2.font = '92px sans-serif';
    c2.textAlign = 'center';
    c2.textBaseline = 'middle';
    c2.fillText(emoji, 64, 70);
    return new THREE.CanvasTexture(cvs);
  }
  const itemTextures = {
    bombUp: makeEmojiTexture('💣'),
    fireUp: makeEmojiTexture('🔥'),
    speedUp: makeEmojiTexture('🛼'),
  };
  function makeGlowSprite(colorHex, size){
    const m = new THREE.SpriteMaterial({ map:glowTexture, color:colorHex, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false });
    const sprite = new THREE.Sprite(m);
    sprite.scale.set(size,size,1);
    return sprite;
  }

  // Small proper 3D models for the four warp-zone treasures, built the same
  // way as the crown (real geometry, not a flat emoji sprite) so they read
  // clearly as the actual item rather than a vaguely-similar stand-in icon.
  function makeTreasureMesh(type){
    const g = new THREE.Group();
    const goldMat = basicMat(0xffd75e);
    if(type==='ring'){
      const band = new THREE.Mesh(geo.torus, goldMat);
      band.scale.set(0.6,0.6,0.6);
      band.rotation.x = Math.PI/2.3;
      g.add(band);
      const gem = new THREE.Mesh(geo.icosa, basicMat(0xff3b6b));
      gem.scale.set(0.16,0.16,0.16);
      gem.position.set(0, 0.15, 0.16);
      g.add(gem);
    } else if(type==='earring'){
      const hoop = new THREE.Mesh(geo.torus, goldMat);
      hoop.scale.set(0.4,0.4,0.4);
      g.add(hoop);
      const post = new THREE.Mesh(geo.cylinder, goldMat);
      post.scale.set(0.05,0.14,0.05);
      post.position.set(0, 0.18, 0);
      g.add(post);
      const gem = new THREE.Mesh(geo.icosa, basicMat(0xcdefff));
      gem.scale.set(0.14,0.14,0.14);
      gem.position.set(0, -0.36, 0);
      g.add(gem);
    } else if(type==='necklace'){
      const loop = new THREE.Mesh(geo.torus, goldMat);
      loop.scale.set(0.85,0.85,0.65);
      loop.rotation.x = Math.PI/2.15;
      g.add(loop);
      const gem = new THREE.Mesh(geo.icosa, basicMat(0x2ecc71));
      gem.scale.set(0.18,0.18,0.18);
      gem.position.set(0, -0.06, 0.4);
      g.add(gem);
    } else if(type==='goldbar'){
      const bar = new THREE.Mesh(geo.box, goldMat);
      bar.scale.set(0.62,0.26,0.38);
      addGlowEdges(bar, 0x7a5a10, 0.7);
      g.add(bar);
      const shine = new THREE.Mesh(geo.box, basicMat(0xfff3c0, {transparent:true, opacity:0.5}));
      shine.scale.set(0.5,0.28,0.06);
      shine.position.set(0, 0.005, 0.1);
      g.add(shine);
    }
    return g;
  }

  function createWallTexture(){
    const res = 128;
    const cvs = document.createElement('canvas');
    cvs.width = cvs.height = res;
    const c2 = cvs.getContext('2d');
    c2.fillStyle = '#8a8a8a';
    c2.fillRect(0,0,res,res);
    // brick courses
    const rowH = res/5;
    for(let row=0; row<5; row++){
      const offset = (row%2===0) ? 0 : res/6;
      c2.strokeStyle = 'rgba(0,0,0,0.35)';

  function disposeGroup(group){

      group.remove(obj);

    disposeGroup(boardGroup);

    floorMesh.position.set(0,0,0);
    boardGroup.add(floorMesh);
    for(let y=0;y<ROWS;y++){
      tileMeshes.push(new Array(COLS).fill(null));

  function addTileMesh(gx,gy){
    const cell = grid[gy][gx];
    if(cell!==1 && cell!==2 && cell!==3) return;
    const w = cellCenterToWorld(gx,gy);
    const isWall = cell===1;
    const isTreasure = cell===3;
    const h = isWall ? 1.0 : 0.55;
    const g = new THREE.Group();

    const wallMat = spaceMode ? mat.spaceWall : mat.wall;
    const blockMat = spaceMode ? mat.spaceBlock : mat.block;
    const bodyMat = isTreasure ? basicMat(0xffd75e) : (isWall ? wallMat : blockMat);
    const body = new THREE.Mesh(geo.box, bodyMat);
    body.scale.set(isWall ? 0.92 : 0.86, h, isWall ? 0.92 : 0.86);
    body.position.set(w.x, h/2, w.z);
    addGlowEdges(body, isTreasure ? 0xffe066 : 0, isTreasure ? 0.9 : 0.45);
    g.add(body);
    if(isTreasure){
      // an unmistakable golden glow so it reads as "special" - normal bombs
      // can't touch it, only the destroy ray can crack it open
      const glow = makeGlowSprite(0xffe066, 1.5);
      glow.position.set(w.x, h+0.35, w.z);
      g.add(glow);
      const light = new THREE.PointLight(0xffe066, 0.9, 2.4);
      light.position.set(w.x, h*0.7, w.z);
      g.add(light);
    }

    boardGroup.add(g);
    tileMeshes[gy][gx] = g;
  }

  function makeAlienBossMesh(withCrown, gunHands){
    // an amorphous space lifeform: a pulsating translucent membrane wrapped
    // around a glowing core, with waving tentacles and scattered eyes -
    // deliberately nothing like the mechanical player/enemy models.
    // Stretched tall: a distinct smaller "head" mass (with its eyes
    // clustered on the forward side, so it reads as facing whichever way
    // the creature is moving) sits atop a much taller torso, connected by a
    // long membranous neck, with tentacles trailing from its underside
    // like a jellyfish.
    const g = new THREE.Group();

    const coreMat = stdMat(0x3a0a55, 0x1a0030, {roughness:0.35, metalness:0.1});
    const tentacleMat = basicMat(0x4a1568);
    const tipGlowColor = 0x39ffb0;
    const membraneColor = 0x8a3ad0;

    // torso mass - the bulk of the creature
    const torso = new THREE.Mesh(geo.icosa, coreMat);
    torso.scale.set(0.4,0.42,0.4);
    torso.position.y = 0.62;
    g.add(torso);
    const torsoMembrane = new THREE.Mesh(geo.sphere, basicMat(membraneColor, {transparent:true, opacity:0.22}));
    torsoMembrane.scale.set(0.58,0.6,0.58);
    torsoMembrane.position.y = 0.64;
    g.add(torsoMembrane);
    const coreGlow = new THREE.PointLight(0xaa4dff, 0.9, 3);
    coreGlow.position.y = 0.62;
    g.add(coreGlow);

    // thin translucent neck connecting torso to head, stretched much
    // longer so the creature reads as unmistakably tall
    const neck = new THREE.Mesh(geo.cylinder, basicMat(membraneColor, {transparent:true, opacity:0.32}));
    neck.scale.set(0.16,0.85,0.16);
    neck.position.y = 1.4;
    g.add(neck);

    // smaller head mass on top
    const head = new THREE.Mesh(geo.sphere, coreMat);
    head.scale.set(0.36,0.38,0.36);
    head.position.y = 1.95;
    g.add(head);
    const headMembrane = new THREE.Mesh(geo.sphere, basicMat(membraneColor, {transparent:true, opacity:0.24}));
    headMembrane.scale.set(0.48,0.5,0.48);
    headMembrane.position.y = 1.96;
    g.add(headMembrane);
    const headGlow = new THREE.PointLight(0xaa4dff, 0.6, 2.2);
    headGlow.position.y = 1.95;
    g.add(headGlow);

    // waving tentacles hanging from the torso's underside down toward the
    // ground, each with a bioluminescent glowing tip - reads as legs/a
    // trailing skirt while the creature floats forward
    const tentacleCount = 7;
    for(let i=0;i<tentacleCount;i++){
      const angle = (i/tentacleCount)*Math.PI*2;
      const outX = Math.cos(angle), outZ = Math.sin(angle);
      const tentacle = new THREE.Mesh(geo.cylinder, tentacleMat);
      tentacle.scale.set(0.045, 0.5, 0.045);
      tentacle.position.set(outX*0.2, 0.2, outZ*0.2);
      tentacle.rotation.x = outZ*0.5;
      tentacle.rotation.z = -outX*0.5;
      g.add(tentacle);
      const tip = new THREE.Mesh(geo.sphere, basicMat(tipGlowColor));
      tip.scale.set(0.055,0.055,0.055);
      tip.position.set(outX*0.32, 0.02, outZ*0.32);
      g.add(tip);
    }

    // eyes clustered on the head's forward (+z) hemisphere, so the
    // creature has a clear "face" that visibly turns to track its heading
    const eyeSpots = [
      [0, 1.98, 0.2, 0.06],
      [-0.13, 1.94, 0.16, 0.045],
      [0.13, 1.94, 0.16, 0.045],
      [-0.07, 2.05, 0.13, 0.035],
      [0.07, 2.05, 0.13, 0.035],
    ];
    for(const [ex,ey,ez,es] of eyeSpots){
      const eye = new THREE.Mesh(geo.sphere, basicMat(0xff3b3b));
      eye.scale.set(es,es,es);
      eye.position.set(ex,ey,ez);
      g.add(eye);
    }
    // a few extra scattered eyes on the torso for continuity with the
    // creature's original design language
    const bodyEyeCount = 4;
    for(let i=0;i<bodyEyeCount;i++){
      const a1 = (i/bodyEyeCount)*Math.PI*2 + 0.6;
      const eye = new THREE.Mesh(geo.sphere, basicMat(0xff3b3b));
      eye.scale.set(0.04,0.04,0.04);
      eye.position.set(Math.cos(a1)*0.34, 0.62+Math.sin(a1*1.7)*0.16, Math.sin(a1)*0.34);
      g.add(eye);

    // the hidden final boss's crown - a simple ringed gold band with

    if(withCrown){

      const band = new THREE.Mesh(geo.cylinder, crownMat);
      band.scale.set(0.3,0.12,0.3);
      band.position.y = 2.16;
      crownGroup.add(band);
      const pointCount = 6;
      for(let i=0;i<pointCount;i++){

      crownGroup.add(crownGlow);

    function addRayGun(side){

      const gunMat = stdMat(0x555566, 0x222233, {roughness:0.3, metalness:0.6});
      const arm = new THREE.Mesh(geo.cylinder, armMat);
      arm.scale.set(0.06,0.34,0.06);
      arm.rotation.z = side*0.9;
      arm.position.set(side*0.28, 0.5, 0.1);
      gunGroup.add(arm);
      const gunBody = new THREE.Mesh(geo.box, gunMat);
      gunBody.scale.set(0.14,0.1,0.32);
      gunBody.position.set(side*0.46, 0.32, 0.2);
      gunGroup.add(gunBody);
      const gunBarrel = new THREE.Mesh(geo.cylinder, gunMat);
      gunBarrel.scale.set(0.045,0.22,0.045);
      gunBarrel.rotation.x = Math.PI/2;
      gunBarrel.position.set(side*0.46, 0.32, 0.4);
      gunGroup.add(gunBarrel);
      const gunTip = new THREE.Mesh(geo.sphere, basicMat(0xff3b3b));

      gunTip.position.set(side*0.46, 0.32, 0.52);
      gunGroup.add(gunTip);
      const gunGlow = new THREE.PointLight(0xff3b3b, 0.5, 1.6);
      gunGlow.position.set(side*0.46, 0.32, 0.45);
      gunGroup.add(gunGlow);
      g.add(gunGroup);
    }
    if(gunHands==='single') addRayGun(1);
    else if(gunHands==='dual'){ addRayGun(1); addRayGun(-1); }

    // soft ground shadow
    const shadow = new THREE.Mesh(geo.ring, basicMat(0x000000, {transparent:true, opacity:0.28, side:THREE.DoubleSide}));
    shadow.rotation.x = -Math.PI/2;
    shadow.scale.set(0.55,0.55,1);
    shadow.position.y = 0.015;

    // same backward lean as the mecha characters, so its clustered eyes
    // read as a face under the steep top-down camera instead of edge-on
    const bodyTilt = new THREE.Group();
    while(g.children.length) bodyTilt.add(g.children[0]);
    bodyTilt.rotation.x = -0.16;
    g.add(bodyTilt);
    g.add(shadow);

    return g;
  }

  // ---------- iOS Safari zoom prevention ----------
  // iOS Safari can still trigger pinch-zoom and double-tap-zoom even with
  // user-scalable=no in the viewport meta tag (it's ignored in some
  // versions), so these are handled directly in JS as a backstop.
  document.addEventListener('gesturestart', e=>e.preventDefault());
  document.addEventListener('gesturechange', e=>e.preventDefault());
  // Prevent the page itself from scrolling/bouncing no matter where the
  // drag starts (e.g. dragging the joystick downward) - single-finger drags
  // are blocked here too, not just pinch gestures.
  document.addEventListener('touchmove', e=>{
    e.preventDefault();
  }, { passive:false });
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e=>{
    const now = Date.now();
    if(now - lastTouchEnd <= 350) e.preventDefault();
    lastTouchEnd = now;
  }, { passive:false });

  // ---------- Audio (procedural - no external files needed) ----------
  let audioCtx = null;
  let audioEnabled = true;
  let bgmPlaying = false;
  let bgmIndex = 0;
  let bgmNextTime = 0;

  function ensureAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();
      // iOS Safari sometimes needs a played (even silent) buffer right at
      // creation time, within the same user-gesture call stack, to fully
      // unlock the audio hardware - just resuming isn't always enough.
      try{
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const src = audioCtx.createBufferSource();
        src.buffer = buffer;
        src.connect(audioCtx.destination);
        src.start(0);
      } catch(e){}
    }
    if(audioCtx.state==='suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, duration, type, volume, startDelay){
    if(!audioEnabled) return;
    const ac = ensureAudio();
    if(!ac) return;
    type = type || 'square';
    volume = volume===undefined ? 0.15 : volume;
    startDelay = startDelay || 0;
    const t0 = ac.currentTime + startDelay;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(volume, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
    osc.connect(gain).connect(ac.destination);
    osc.start(t0);
    osc.stop(t0+duration+0.02);
  }

  function playSlide(freqFrom, freqTo, duration, type, volume, startDelay){
    if(!audioEnabled) return;
    const ac = ensureAudio();
    if(!ac) return;
    startDelay = startDelay || 0;
    const t0 = ac.currentTime + startDelay;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type || 'sawtooth';
    osc.frequency.setValueAtTime(freqFrom, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20,freqTo), t0+duration);
    gain.gain.setValueAtTime(volume===undefined?0.15:volume, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
    osc.connect(gain).connect(ac.destination);
    osc.start(t0);
    osc.stop(t0+duration+0.02);
  }

  function playNoise(duration, volume, startDelay){
    if(!audioEnabled) return;
    const ac = ensureAudio();
    if(!ac) return;
    volume = volume===undefined ? 0.2 : volume;
    startDelay = startDelay || 0;
    const t0 = ac.currentTime + startDelay;
    const bufferSize = Math.max(1, Math.floor(ac.sampleRate*duration));
    const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1-i/bufferSize); }
    const noise = ac.createBufferSource();
    noise.buffer = buffer;
    const gain = ac.createGain();
    gain.gain.setValueAtTime(volume, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
    noise.connect(gain).connect(ac.destination);
    noise.start(t0);
  }

  // Approximates a single human vocal syllable (a laugh "ha"/"ho" or a
  // shout) using plain oscillators: a quick two-stage pitch bounce (mimics
  // the vocal cords releasing then settling), a quiet upper harmonic for a
  // less pure-tone/synthy timbre, and a soft noise bed underneath for
  // breathiness - much closer to a voice than a single flat tone or slide.
  // A single "vowel" burst shaped through a resonant bandpass filter tuned
  // near a vocal formant frequency - this is what actually gets a plain
  // oscillator to stop sounding like a beep and start sounding like an
  // open-mouthed "ha"/"fu" vowel. Two filtered layers (roughly the first
  // and second vocal formants) are stacked for a fuller, less thin timbre.
  function playFormantBurst(freq, duration, volume, startDelay, formant1, formant2, wave){
    if(!audioEnabled) return;
    const ac = ensureAudio();
    if(!ac) return;
    wave = wave || 'sawtooth';
    startDelay = startDelay || 0;
    const t0 = ac.currentTime + startDelay;
    const osc = ac.createOscillator();
    osc.type = wave;
    osc.frequency.setValueAtTime(freq, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq*0.8), t0+duration);
    const amp = ac.createGain();
    amp.gain.setValueAtTime(0.0001, t0);
    amp.gain.exponentialRampToValueAtTime(1, t0+Math.min(0.025, duration*0.25));
    amp.gain.exponentialRampToValueAtTime(0.001, t0+duration);
    osc.connect(amp);

    const f1 = ac.createBiquadFilter();
    f1.type = 'bandpass'; f1.frequency.setValueAtTime(formant1, t0); f1.Q.value = 4.5;
    const g1 = ac.createGain(); g1.gain.setValueAtTime(volume, t0);
    amp.connect(f1).connect(g1).connect(ac.destination);

    const f2 = ac.createBiquadFilter();
    f2.type = 'bandpass'; f2.frequency.setValueAtTime(formant2, t0); f2.Q.value = 6;
    const g2 = ac.createGain(); g2.gain.setValueAtTime(volume*0.55, t0);
    amp.connect(f2).connect(g2).connect(ac.destination);

    osc.start(t0);
    osc.stop(t0+duration+0.02);
  }

  // A rhythmic run of laugh syllables ("ha-ha-ha"/"fu-fu-fu") with a bit of
  // pitch bounce syllable-to-syllable, like real laughter rather than a
  // perfectly even machine loop.
  function playLaughRun(baseFreq, count, gap, syllableDur, volume, startDelay, formant1, formant2, wave){
    for(let i=0;i<count;i++){

  function updateBGM(){
    if(!audioEnabled || !bgmPlaying) return;
    const ac = ensureAudio();
    if(!ac) return;
    const key = bgmKeyForStage();
    if(key!==currentBgmKey){
      currentBgmKey = key;
      bgmIndex = 0;
      bgmNextTime = 0; // let the new theme's first note play immediately
    }
    const pattern = BGM_PATTERNS[key];
    if(ac.currentTime >= bgmNextTime){
      const freq = pattern.notes[bgmIndex % pattern.notes.length];
      const vol = key==='hiddenBoss' ? 0.08 : ((key==='trueBoss') ? 0.06 : 0.11);
      playTone(freq, pattern.noteDuration*0.85, pattern.wave, vol);
      if(pattern.bassAccent){
        // configurable low-end backing pulse, distinct per theme
        const every = pattern.bassEvery || 2;
        if(bgmIndex % every===0){
          const bassWave = pattern.bassWave || 'square';
          const bassDiv = pattern.bassDiv || 4;
          playTone(freq/bassDiv, pattern.noteDuration*1.6, bassWave, vol*1.1);
        }
      } else if(bgmIndex % 4===0){
        playTone(freq/2, pattern.noteDuration*0.85, 'sine', vol*0.8);
      }
      bgmIndex++;
      bgmNextTime = ac.currentTime + pattern.noteDuration;
    }
  }

  // Rough "is this cell about to be in a blast" check, used by the true
  // boss's flee AI. It doesn't bother tracing through walls/blocks (that
  // would be overkill for an AI safety check) - being a little overly
  // cautious about a same-row/column bomb is fine and just makes it dodge
  // a bit more than strictly necessary.
  // Mirrors the real explosion algorithm (stops dead at a hard wall, absorbed
  // by one destructible block) so that a cell genuinely protected by a wall
  // is correctly seen as safe - the previous version checked whole rows/
  // columns ignoring walls entirely, which (especially at max fire range)
  // made almost the entire map look "dangerous" with nowhere actually safe
  // to flee to, so the true boss kept dying no matter what it did.
  function isCellDangerous(gx,gy){
    for(const b of bombs){
      if(b.exploded) continue;
      if(b.gx===gx && b.gy===gy) return true;
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      for(const [dx,dy] of dirs){
        const range = (b.owner===hiddenBoss) ? (dy===0 ? COLS : ROWS) : ((b.owner && b.owner.fireRange) || 2);
        for(let r=1; r<=range; r++){
          const cx = b.gx+dx*r, cy = b.gy+dy*r;
          if(cx<0||cy<0||cx>=COLS||cy>=ROWS) break;
          if(!grid[cy]) break;
          if(grid[cy][cx]===1) break; // hard wall stops the blast completely
          if(cx===gx && cy===gy) return true;
          if(grid[cy][cx]===2 || grid[cy][cx]===3) break; // block absorbs the blast, same as a real explosion
        }
      }
      if(b.dangerous){
        const diagDirs = [[1,1],[1,-1],[-1,1],[-1,-1]];
        for(const [dx,dy] of diagDirs){
          const cx = b.gx+dx, cy = b.gy+dy;
          if(cx<0||cy<0||cx>=COLS||cy>=ROWS) continue;
          if(!grid[cy]) continue;
          if(grid[cy][cx]===1 || grid[cy][cx]===3) continue;
          if(cx===gx && cy===gy) return true;
        }
      }
    }
    return false;
  }

  // ---- continuous collision (used by enemies only) ----
  function collides(x,y){
    const pts = [
      [x+PAD, y+PAD],
      [x+ENTITY_SIZE-PAD, y+PAD],
      [x+PAD, y+ENTITY_SIZE-PAD],
      [x+ENTITY_SIZE-PAD, y+ENTITY_SIZE-PAD]
    ];
    for(const [px,py] of pts){
      const gx = Math.floor(px/TILE), gy = Math.floor(py/TILE);
      if(isSolidTile(gx,gy)) return true;
      if(bombAtCell(gx,gy)) return true;
    }
    return false;
  }
  function tryMoveEnemy(entity, dx, dy){
    if(dx!==0){
      const nx = entity.x + dx;
      if(!collides(nx, entity.y)) entity.x = nx;
    }
    if(dy!==0){
      const ny = entity.y + dy;
      if(!collides(entity.x, ny)) entity.y = ny;
    }
  }
  function centerTile(e){
    return {
      gx: Math.floor((e.x+ENTITY_SIZE/2)/TILE),
      gy: Math.floor((e.y+ENTITY_SIZE/2)/TILE)
    };
  }

  // Continuously-moving entities (enemies, the first boss) can be straddling
  // two tiles at once. Checking only their single "center tile" against the
  // blast cells can miss a hit if their center happens to be a hair over the
  // boundary into the *next* tile while their body still overlaps the
  // burning one. This checks real rectangle overlap against every blast
  // cell instead, so a partial overlap still counts.
  function tileOverlapsEntity(gx, gy, e){
    const left = gx*TILE, top = gy*TILE;
    return e.x < left+TILE && e.x+ENTITY_SIZE > left &&
           e.y < top+TILE && e.y+ENTITY_SIZE > top;
  }

  function overlaps(a,b){
    return a.x < b.x+ENTITY_SIZE && a.x+ENTITY_SIZE > b.x &&
           a.y < b.y+ENTITY_SIZE && a.y+ENTITY_SIZE > b.y;
  }

  function triggerShake(duration, magnitude){
    shakeTimer = Math.max(shakeTimer, duration);
    shakeMagnitude = Math.max(shakeMagnitude, magnitude);
  }

  // A generic "died" burst: a ring of particles flying outward plus a quick
  // flash, scaled by `intensity` so the same system can be a small pop for a
  // grunt enemy or a screen-shaking spectacle for the true boss.
  // A much slower, longer-lived version of spawnDeathEffect used for the
  // big cinematic "boss bursts apart" cutscenes - same rendering system
  // (deathEffects/syncDeathEffects3D), just with drifting rather than
  // exploding particles, so it reads as slow motion without needing an
  // actual game-wide time-scale system.
  function spawnSlowBurst(x, y, color, count, duration){
    const particles = [];
    for(let i=0;i<count;i++){
      const angle = (i/count)*Math.PI*2 + Math.random()*0.5;
      const speed = 16 + Math.random()*24;
      particles.push({
        x, y,
        dx: Math.cos(angle)*speed,
        dy: Math.sin(angle)*speed,
        size: 5 + Math.random()*5,
      });
    }
    deathEffects.push({ particles, timer:duration, maxTimer:duration, x, y, color, intensity:1 });
  }

  function spawnDeathEffect(x, y, color, intensity){
    const count = Math.round(7 * intensity) + 4;
    const particles = [];
    for(let i=0; i<count; i++){
      const angle = (i/count)*Math.PI*2 + Math.random()*0.4;
      const speed = (55 + Math.random()*70) * Math.min(intensity, 2.2);
      particles.push({
        x, y,
        dx: Math.cos(angle)*speed,
        dy: Math.sin(angle)*speed,
        size: (2.5 + Math.random()*2.5) * Math.min(intensity, 2),
      });
    }
    const duration = 0.45 + 0.18*intensity;
    deathEffects.push({ particles, timer:duration, maxTimer:duration, x, y, color, intensity });
    if(intensity>=2.5){
      triggerShake(0.4, 6);
    } else if(intensity>=1.6){
      triggerShake(0.25, 3);
    }
  }

  function updateDeathEffects(dt){
    for(const fx of deathEffects){
      fx.timer -= dt;
      for(const p of fx.particles){
        p.x += p.dx*dt;
        p.y += p.dy*dt;
        p.dx *= 0.94;
        p.dy *= 0.94;
      }
    }
    deathEffects = deathEffects.filter(fx=>fx.timer>0);
    if(shakeTimer>0) shakeTimer -= dt;
  }

  // A destroyed block bursts into a few tumbling metal/spark fragments
  // instead of just vanishing.
  function spawnBlockDebris(gx, gy){
    const cx = gx*TILE+TILE/2, cy = gy*TILE+TILE/2;
    const particles = [];
    const count = 7;
    for(let i=0;i<count;i++){
      const angle = (i/count)*Math.PI*2 + Math.random()*0.6;
      const speed = 45 + Math.random()*65;
      particles.push({
        x:cx, y:cy,
        dx:Math.cos(angle)*speed, dy:Math.sin(angle)*speed - 30,
        size: 2 + Math.random()*3,
        rot: Math.random()*Math.PI*2,
        rotSpeed: (Math.random()-0.5)*9,
        color: Math.random()<0.55 ? '#ffaa28' : '#6df3ff'
      });
    }
    blockDebris.push({ particles, timer:0.5, maxTimer:0.5 });
  }

  function updateBlockDebris(dt){
    for(const fx of blockDebris){
      fx.timer -= dt;
      for(const p of fx.particles){
        p.x += p.dx*dt;
        p.y += p.dy*dt;
        p.dy += 170*dt;
        p.rot += p.rotSpeed*dt;
      }
    }
    blockDebris = blockDebris.filter(fx=>fx.timer>0);
  }

  function syncBlockDebris3D(){
    for(const fx of blockDebris){
      const life = Math.max(0, fx.timer/fx.maxTimer);
      for(const p of fx.particles){
        const w = pixelToWorld(p.x, p.y);
        const mesh = new THREE.Mesh(geo.box, p.color==='#ffaa28' ? mat.debrisMetal : mat.debrisSpark);
        const s = (p.size/TILE)*1.4;
        mesh.scale.set(s,s,s);
        mesh.position.set(w.x, 0.15+life*0.5, w.z);
        mesh.rotation.set(p.rot, p.rot*0.7, 0);
        mesh.material = mesh.material.clone();
        mesh.material.transparent = true;
        mesh.material.opacity = life;
        dynamicGroup.add(mesh);
      }
    }
  }

  function syncDeathEffects3D(){
    for(const fx of deathEffects){
      const life = Math.max(0, fx.timer/fx.maxTimer);
      for(const p of fx.particles){
        const w = pixelToWorld(p.x, p.y);
        const mesh = new THREE.Mesh(geo.sphere, mat.deathParticle.clone());
        const s = (p.size*life/TILE)*1.6;
        mesh.scale.set(s,s,s);
        mesh.position.set(w.x, 0.3, w.z);
        mesh.material.color.set(fx.color);
        mesh.material.transparent = true;
        mesh.material.opacity = life;
        dynamicGroup.add(mesh);
      }
    }
  }

  // ---- classic grid-locked movement for the player ----
  // The player always occupies a grid cell, or is smoothly interpolating
  // between two adjacent cells. At any moment there is exactly ONE intended
  // direction (whichever axis of the stick/keys is stronger) - no ambiguous
  // "two candidate directions" to referee, which is what made turning feel
  // unpredictable before. A turn can be accepted at any point during travel,
  // snapping to whichever grid line (the cell you're leaving or the one
  // you're arriving at) is nearest, so it responds immediately instead of
  // needing to reach a certain point first.
  function occupiedCell(entity){
    if(entity.progress>0.5){
      return { gx: entity.gx+entity.moveDir.dx, gy: entity.gy+entity.moveDir.dy };
    }
    return { gx: entity.gx, gy: entity.gy };
  }

  function dominantDirection(dx,dy){
    const DEADZONE = 0.2;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if(ax<DEADZONE && ay<DEADZONE) return { dx:0, dy:0 };
    if(ax>=ay) return { dx:Math.sign(dx), dy:0 };
    return { dx:0, dy:Math.sign(dy) };
  }

  function canEnterOrKick(entity, fromGx, fromGy, dx, dy){
    const tgx = fromGx+dx, tgy = fromGy+dy;
    if(isSolidTile(tgx,tgy)) return false;
    const b = bombAtCell(tgx,tgy);
    if(b){
      if(entity.canKick && !b.rolling){
        const beyondX=tgx+dx, beyondY=tgy+dy;
        if(!isSolidTile(beyondX,beyondY) && !bombAtCell(beyondX,beyondY)){
          b.rolling = true;
          b.rollDx = dx; b.rollDy = dy;
          if(entity===player) sfx.kick();
        }
      }
      return false;
    }
    return true;
  }

  function tryStartMove(entity, c){
    if(canEnterOrKick(entity, entity.gx, entity.gy, c.dx, c.dy)){
      entity.moveDir = { dx:c.dx, dy:c.dy };
      return true;
    }
    return false;
  }

  function updateGridMovement(entity, dt, rawDx, rawDy){
    const desired = dominantDirection(rawDx, rawDy);
    const speedFrac = entity.speed*dt/TILE;

    if(entity.moveDir.dx===0 && entity.moveDir.dy===0){
      // idle at a cell boundary: try to start moving in the pressed direction
      if(desired.dx!==0 || desired.dy!==0) tryStartMove(entity, desired);
    } else {
      const cur = entity.moveDir;
      const isTurn = (desired.dx!==0 || desired.dy!==0) &&
                     !(desired.dx===cur.dx && desired.dy===cur.dy) &&
                     !(desired.dx===-cur.dx && desired.dy===-cur.dy);

      if(isTurn){
        // Snap-turn at whichever grid line is nearer: if we're less than
        // halfway into this tile, treat the cell we started from as the
        // pivot; otherwise treat the cell we're arriving at as the pivot.
        // Either way, turning becomes available immediately rather than
        // only very early or very late in the crossing.
        const nearOrigin = entity.progress < 0.5;
        const pivotGx = nearOrigin ? entity.gx : entity.gx + cur.dx;
        const pivotGy = nearOrigin ? entity.gy : entity.gy + cur.dy;
        if(canEnterOrKick(entity, pivotGx, pivotGy, desired.dx, desired.dy)){
          entity.gx = pivotGx; entity.gy = pivotGy;
          entity.moveDir = { dx:desired.dx, dy:desired.dy };
          entity.progress = 0;
        }
        // if the turn isn't actually open, we just keep going straight below
      }
    }

    if(entity.moveDir.dx!==0 || entity.moveDir.dy!==0){
      const cur = entity.moveDir;
      if(desired.dx===0 && desired.dy===0){
        // input released - freeze exactly where we are, don't auto-finish the tile
      } else if(desired.dx===-cur.dx && desired.dy===-cur.dy){
        // pressing directly backward - retreat smoothly back into the previous cell
        entity.progress -= speedFrac;
        if(entity.progress<=0){
          entity.progress = 0;
          entity.moveDir = { dx:0, dy:0 };
        }
      } else {
        // continuing forward (this also covers a turn attempt that failed,
        // in which case we just keep going the way we were already headed)
        entity.progress += speedFrac;
        if(entity.progress>=1){
          const leftover = Math.min(entity.progress-1, 0.99);
          entity.gx += cur.dx; entity.gy += cur.dy;
          entity.progress = 0;
          entity.moveDir = { dx:0, dy:0 };
          if(desired.dx!==0 || desired.dy!==0){
            if(tryStartMove(entity, desired)) entity.progress = leftover;
          }
        }
      }
    }

    entity.x = (entity.gx + entity.moveDir.dx*entity.progress)*TILE + (TILE-ENTITY_SIZE)/2;
    entity.y = (entity.gy + entity.moveDir.dy*entity.progress)*TILE + (TILE-ENTITY_SIZE)/2;
  }

  // ---------- Input: virtual joystick + keyboard ----------
  const keys = { up:false, down:false, left:false, right:false };
  let joyActive = false;
  let joyVec = { x:0, y:0 };
  let joyPointerId = null;

  const joyBase = document.getElementById('joyBase');
  const joyKnob = document.getElementById('joyKnob');
  const JOY_MAX = 46;

  function updateJoyFromEvent(e){
    const rect = joyBase.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    let dx = e.clientX - cx;
    let dy = e.clientY - cy;
    const dist = Math.hypot(dx,dy);
    const clamped = Math.min(dist, JOY_MAX);
    const nx = dist>0 ? dx/dist : 0;
    const ny = dist>0 ? dy/dist : 0;
    joyVec.x = nx * (clamped/JOY_MAX);
    joyVec.y = ny * (clamped/JOY_MAX);
    joyKnob.style.transform = `translate(${nx*clamped}px, ${ny*clamped}px)`;
  }

  function resetJoy(){
    joyActive = false;
    joyVec.x = 0; joyVec.y = 0;
    joyKnob.style.transform = 'translate(0,0)';
  }

  joyBase.addEventListener('pointerdown', e=>{
    e.preventDefault();
    joyActive = true;
    joyPointerId = e.pointerId;
    joyBase.setPointerCapture(e.pointerId);
    updateJoyFromEvent(e);
  });
  joyBase.addEventListener('pointermove', e=>{
    if(!joyActive || e.pointerId!==joyPointerId) return;
    e.preventDefault();
    updateJoyFromEvent(e);
  });
  function endJoy(e){
    if(e.pointerId!==joyPointerId) return;
    resetJoy();
  }
  joyBase.addEventListener('pointerup', endJoy);
  joyBase.addEventListener('pointercancel', endJoy);

  function activateInvincibility(){
    if(gameOver || gameWin || !player.alive) return;
    if(player.invincibleUsed || player.invincibleTimer>0) return;
    player.invincibleUsed = true;
    player.invincibleTimer = 5.0;
    player.invinciblePulseTimer = 0;
    invincibleBtn.disabled = true;
    invincibleBtn.innerHTML = '使用済み';
    sfx.invincibleActivate();
  }

  // The destroy ray: fires once in whichever direction the player is
  // currently facing, piercing straight across the arena. A direct hit on
  // the hidden final boss cracks its crown (marking it for a cracked-crown
  // drop later) and either strips its last-stand shield or, outside that
  // fight, chips 3 HP with a floor of 1 so the finishing blow always has to
  // come from a bomb. It only ever fires once in the whole game - in the
  // warp zone (stage 7) it can crack open exactly one of the four corner
  // treasure blocks, but doing so spends the only shot, so it's no longer
  // available later against the hidden boss (and vice versa).
  function activateDestroyRay(){
    if(gameOver || gameWin || !player.alive) return;
    if(!destroyRayMode) return;
    if(player.destroyRayUsed) return;
    if(player.destroyRayCooldown>0) return;
    const dirMap = { up:{dx:0,dy:-1}, down:{dx:0,dy:1}, left:{dx:-1,dy:0}, right:{dx:1,dy:0} };
    const d = dirMap[player.facing] || {dx:0,dy:1};
    const originX = player.x+ENTITY_SIZE/2, originY = player.y+ENTITY_SIZE/2;
    player.destroyRayUsed = true; // spent for good, the instant it's fired - whatever it does or doesn't hit
    player.destroyRayCooldown = 1.6;
    destroyRayBtn.disabled = true;
    destroyRayBtn.innerHTML = '使用済み';
    destroyRayBeam = { x:originX, y:originY, dx:d.dx, dy:d.dy, timer:0.3 };
    sfx.bossFire();
    if(stage===9 && hiddenBoss && hiddenBoss.alive){
      const bx = hiddenBoss.x+ENTITY_SIZE/2, by = hiddenBoss.y+ENTITY_SIZE/2;
      let hit = false;
      if(d.dx!==0) hit = Math.abs(by-originY) < ENTITY_SIZE*1.1 && (d.dx>0 ? bx>originX : bx<originX);
      else hit = Math.abs(bx-originX) < ENTITY_SIZE*1.1 && (d.dy>0 ? by>originY : by<originY);
      if(hit) applyDestroyRayHit();
    }
    if(stage===7 && treasureBlocks){
      for(const key of Object.keys(treasureBlocks)){
        const tb = treasureBlocks[key];
        if(tb.broken) continue;
        const tx = tb.gx*TILE+TILE/2, ty = tb.gy*TILE+TILE/2;
        let hit = false;
        if(d.dx!==0) hit = Math.abs(ty-originY) < TILE*0.5 && (d.dx>0 ? tx>originX : tx<originX);
        else hit = Math.abs(tx-originX) < TILE*0.5 && (d.dy>0 ? ty>originY : ty<originY);
        if(hit){
          breakTreasureBlock(tb);
          break; // the ray (and its one shot) stops the instant it cracks one open
        }
      }
    }
  }

  // Cracking a treasure block only reveals the item lying inside as a real
  // floor pickup - the player still has to walk over it to actually claim
  // it (matching how every other item in the game works), rather than
  // granting it automatically the moment the block is destroyed.
  // Wipes out any treasure blocks that never got cracked open, and any
  // treasure items already revealed but not yet picked up - called the
  // instant the player commits to the black hole, since anything left
  // behind in the warp zone is gone for good once it collapses.
  function clearTreasureBlocks(){
    if(treasureBlocks){
      for(const key of Object.keys(treasureBlocks)){
        const tb = treasureBlocks[key];
        if(!tb.broken && grid[tb.gy] && grid[tb.gy][tb.gx]===3){
          grid[tb.gy][tb.gx] = 0;
          removeTileMesh(tb.gx, tb.gy);
        }
      }
    }
    treasureBlocks = null;
    items = items.filter(it=>!TREASURE_INFO[it.type]);
  }

  function breakTreasureBlock(tb){
    tb.broken = true;
    grid[tb.gy][tb.gx] = 0;
    removeTileMesh(tb.gx, tb.gy);
    spawnBlockDebris(tb.gx, tb.gy);
    items.push({ gx:tb.gx, gy:tb.gy, type:tb.itemKey });
    triggerShake(0.25, 5);
    sfx.stepItem();
  }

  function applyDestroyRayHit(){
    if(!hiddenBoss || !hiddenBoss.alive) return;
    if(hiddenBoss.dormant){
      hiddenBoss.dormant = false;
      sfx.hiddenBossAngry();
    }
    triggerShake(0.25, 6);
    sfx.bossHit();
    if(hiddenBoss.phase==='cage' && hiddenBoss.shieldActive){
      // this hit only breaks the shield - it never touches the boss
      // itself, so the crown stays intact
      hiddenBoss.shieldActive = false;
      hiddenBoss.invuln = 0.3;
      timeStopTimer = 0.35;
      shieldBreakEffectTimer = 0.7;
    } else {
      // a direct hit on the boss's body - this is what cracks the crown
      const firstCrack = !hiddenBoss.crownCracked;
      crownCracked = true;
      hiddenBoss.crownCracked = true;
      // a long, clear freeze-frame beat every time a direct hit connects,
      // with the crown-shard burst effect timed to match
      timeStopTimer = 1.2;
      crownCrackEffectTimer = 1.8;
      if(firstCrack){
        // the crown visibly breaks and comes flying off, for good
        if(hiddenBoss.mesh3d && hiddenBoss.mesh3d.userData.crownGroup){
          hiddenBoss.mesh3d.userData.crownGroup.visible = false;
        }
        const hw = { x: hiddenBoss.x+ENTITY_SIZE/2, y: hiddenBoss.y+ENTITY_SIZE/2 };
        spawnDeathEffect(hw.x, hw.y, '#ffd75e', 2.2);
        spawnSlowBurst(hw.x, hw.y, '#ffd75e', 24, 1.6);
        spawnSlowBurst(hw.x, hw.y, '#ff3b6b', 14, 1.4);
        sfx.trueBossDeath();
      }
      hiddenBoss.hp = Math.max(1, hiddenBoss.hp-3);
      hiddenBoss.invuln = 0.3;
    }
    updateHUD();
  }

  function placeBombFor(entity, dangerous){
    if(!entity.alive || entity.bombsAvailable<=0) return false;
    const {gx,gy} = occupiedCell(entity);
    if(bombAtCell(gx,gy)) return false;
    bombs.push({
      gx,gy,timer:BOMB_FUSE,exploded:false,settled:false,
      rolling:false, rollDx:0, rollDy:0,
      cx:gx*TILE+TILE/2, cy:gy*TILE+TILE/2,
      owner: entity,
      dangerous: !!dangerous
    });
    entity.bombsAvailable--;
    return true;
  }

  function placeBomb(){
    if(gameOver || gameWin || !player.alive) return;
    if(placeBombFor(player)){ updateHUD(); sfx.bombPlace(); }
  }

  window.addEventListener('keydown', e=>{
    switch(e.key){
      case 'ArrowUp': case 'w': case 'W': keys.up=true; break;
      case 'ArrowDown': case 's': case 'S': keys.down=true; break;
      case 'ArrowLeft': case 'a': case 'A': keys.left=true; break;
      case 'ArrowRight': case 'd': case 'D': keys.right=true; break;
      case ' ':
        if(!e.repeat){
          if(gameOver || gameWin) resetGame();
          else placeBomb();
        }
        e.preventDefault();
        break;
      case 'z': case 'Z': if(!e.repeat) activateInvincibility(); e.preventDefault(); break;
      case 'x': case 'X': if(!e.repeat && destroyRayMode) activateDestroyRay(); e.preventDefault(); break;
    }
  });
  window.addEventListener('keyup', e=>{
    switch(e.key){
      case 'ArrowUp': case 'w': case 'W': keys.up=false; break;
      case 'ArrowDown': case 's': case 'S': keys.down=false; break;
      case 'ArrowLeft': case 'a': case 'A': keys.left=false; break;
      case 'ArrowRight': case 'd': case 'D': keys.right=false; break;
    }
  });

  const bombBtn = document.getElementById('bombBtn');
  bombBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); placeBomb(); });

  const invincibleBtn = document.getElementById('invincibleBtn');
  invincibleBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); activateInvincibility(); });

  const destroyRayBtn = document.getElementById('destroyRayBtn');
  destroyRayBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); activateDestroyRay(); });

  document.getElementById('restartBtn').addEventListener('click', resetGame);

  const titleScreen = document.getElementById('titleScreen');
  const titlePanel = document.getElementById('titlePanel');
  const storyPanel = document.getElementById('storyPanel');
  document.getElementById('startGameBtn').addEventListener('click', ()=>{
    titlePanel.style.display = 'none';
    storyPanel.style.display = 'block';
  });
  document.getElementById('storyContinueBtn').addEventListener('click', ()=>{
    titleScreen.style.display = 'none';
    startGameplay();
  });

  function skipToFirstBoss(){
    if(gameOver || gameWin) return;
    enemies.forEach(en=>en.alive=false);
    boss = null;
    trueBoss = null;
    bombs = [];
    explosions = [];
    rainBombs = [];
    projectiles = [];

  const muteBtn = document.getElementById('muteBtn');
  muteBtn.addEventListener('click', ()=>{
