  function renderCharacter3D(entity, group, invincible, facingAngle){
    const w = pixelToWorld(entity.x+ENTITY_SIZE/2, entity.y+ENTITY_SIZE/2);
    group.position.set(w.x, 0, w.z);
    if(facingAngle!==undefined && facingAngle!==null){
      if(group.userData.facingAngle===undefined) group.userData.facingAngle = facingAngle;
      let diff = facingAngle - group.userData.facingAngle;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff)); // shortest angular path
      group.userData.facingAngle += diff*0.4;
      group.rotation.y = group.userData.facingAngle;
    }
    const light = group.children.find(c=>c.isPointLight);
    if(light) light.intensity = invincible ? 1.4 : 0.6;
    if(invincible){
      // a clearly visible pulsating golden shield bubble, plus a shimmering
      // ring at ground level - unmistakable at a glance
      const t = performance.now()/260;
      const pulse = 0.9 + 0.1*Math.sin(t);
      const shield = new THREE.Mesh(geo.sphere, basicMat(0xffe066, {transparent:true, opacity:0.22+0.1*Math.sin(t*1.6)}));
      shield.scale.set(0.7*pulse, 0.8*pulse, 0.7*pulse);
      shield.position.set(w.x, 0.5, w.z);
      dynamicGroup.add(shield);
      const shieldGlow = makeGlowSprite(0xffe066, 1.6);
      shieldGlow.position.set(w.x, 0.5, w.z);
      dynamicGroup.add(shieldGlow);
      const shieldRing = new THREE.Mesh(geo.ring, basicMat(0xffe066, {transparent:true, opacity:0.7, side:THREE.DoubleSide}));
      shieldRing.rotation.x = -Math.PI/2;
      shieldRing.scale.set(0.95,0.95,1);
      shieldRing.position.set(w.x, 0.03, w.z);
      dynamicGroup.add(shieldRing);
      const shieldLight = new THREE.PointLight(0xffe066, 1.3, 3.2);
      shieldLight.position.set(w.x, 0.5, w.z);
      dynamicGroup.add(shieldLight);
    }
    dynamicGroup.add(group);
  }

  // Renders one warp-zone portal: a bright swirling white hole, or a dark
  // event-horizon black hole, with orbiting particles spiraling into the
  // core and a couple of rotating accretion rings.
  function renderPortalHole(gx, gy, isWhite){
    const w = cellCenterToWorld(gx, gy);
    const t = performance.now()/1000;
    const ringColor = isWhite ? 0xbfe8ff : 0x8a3ad0;
    const coreMat = isWhite ? basicMat(0xffffff) : basicMat(0x0a0612, {transparent:true, opacity:0.94});
    const core = new THREE.Mesh(geo.sphere, coreMat);
    core.scale.set(0.55,0.55,0.55);
    core.position.set(w.x, 0.6, w.z);
    dynamicGroup.add(core);

    for(let i=0;i<3;i++){
      const ringR = 0.62 + i*0.2;
      const ring = new THREE.Mesh(geo.ring, basicMat(ringColor, {transparent:true, opacity:0.5-i*0.13, side:THREE.DoubleSide}));
      ring.rotation.x = Math.PI/2.4 + Math.sin(t*0.6+i)*0.12;
      ring.rotation.z = t*(isWhite?1.1:-1.4)*(i%2===0?1:-1);
      ring.scale.set(ringR,ringR,1);
      ring.position.set(w.x, 0.6, w.z);
      dynamicGroup.add(ring);
    }

    const count = 8;
    for(let i=0;i<count;i++){
      const phase = (t*(isWhite?0.85:1.25) + i/count) % 1;
      const r = 1.15*(1-phase) + 0.16;
      const ang = i*1.3 + t*(isWhite?2:2.6);
      const px = w.x+Math.cos(ang)*r, pz = w.z+Math.sin(ang)*r;
      const particle = new THREE.Mesh(geo.sphere, basicMat(ringColor, {transparent:true, opacity:0.8*(1-phase)}));
      particle.scale.set(0.07,0.07,0.07);
      particle.position.set(px, 0.6, pz);
      dynamicGroup.add(particle);
    }

    const glow = makeGlowSprite(isWhite?0xffffff:0x8a3ad0, isWhite?2.6:2.0);
    glow.position.set(w.x, 0.6, w.z);
    dynamicGroup.add(glow);
    const light = new THREE.PointLight(isWhite?0xffffff:0x8a3ad0, isWhite?1.4:0.8, 4);
    light.position.set(w.x, 0.6, w.z);
    dynamicGroup.add(light);

    const shadow = new THREE.Mesh(geo.ring, basicMat(0x000000, {transparent:true, opacity:0.3, side:THREE.DoubleSide}));
    shadow.rotation.x = -Math.PI/2;
    shadow.scale.set(0.7,0.7,1);
    shadow.position.set(w.x, 0.015, w.z);
    dynamicGroup.add(shadow);
  }

  // Renders one straight laser-beam segment between two pixel-space points:
  // a soft outer glow tube plus a bright white-hot core, aligned with a
  // quaternion rotation rather than chained sphere sprites, for a much more
  // convincing continuous-beam look.
  function renderBeamSegment(px1, py1, px2, py2, color, thickness, alpha, height){
    const w1 = pixelToWorld(px1, py1), w2 = pixelToWorld(px2, py2);
    const ddx = w2.x-w1.x, ddz = w2.z-w1.z;
    const dist = Math.sqrt(ddx*ddx+ddz*ddz);
    if(dist<0.001) return;
    const dirVec = new THREE.Vector3(ddx,0,ddz).normalize();
    const quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), dirVec);
    const midx = (w1.x+w2.x)/2, midz = (w1.z+w2.z)/2;
    const h = height!==undefined ? height : 1.15;
    const outer = new THREE.Mesh(geo.cylinder, basicMat(color, {transparent:true, opacity:0.32*alpha}));
    outer.scale.set(thickness*2.6, dist, thickness*2.6);
    outer.position.set(midx, h, midz);
    outer.quaternion.copy(quat);
    dynamicGroup.add(outer);
    const mid = new THREE.Mesh(geo.cylinder, basicMat(color, {transparent:true, opacity:0.7*alpha}));
    mid.scale.set(thickness*1.1, dist, thickness*1.1);
    mid.position.set(midx, h, midz);
    mid.quaternion.copy(quat);
    dynamicGroup.add(mid);
    const core = new THREE.Mesh(geo.cylinder, basicMat(0xffffff, {transparent:true, opacity:0.85*alpha}));
    core.scale.set(thickness*0.4, dist, thickness*0.4);
    core.position.set(midx, h, midz);
    core.quaternion.copy(quat);
    dynamicGroup.add(core);
  }

  function makeHpBarTexture(hp, maxHp){
    const w = 160, h = 28;
    const cvs = document.createElement('canvas');
    cvs.width = w; cvs.height = h;
    const c2 = cvs.getContext('2d');
    // dark backing plate so the bar reads clearly against any background
    c2.fillStyle = 'rgba(0,0,0,0.75)';
    c2.fillRect(0,0,w,h);
    c2.strokeStyle = 'rgba(255,255,255,0.9)';
    c2.lineWidth = 3;
    c2.strokeRect(1.5,1.5,w-3,h-3);
    const pad = 5;
    const innerW = w-pad*2, innerH = h-pad*2;
    const ratio = Math.max(0, hp/maxHp);
    c2.fillStyle = ratio>0.5 ? '#3ddc5a' : ratio>0.25 ? '#ffcc33' : '#ff3b3b';
    c2.fillRect(pad, pad, innerW*ratio, innerH);
    // segment dividers, one per HP point
    c2.strokeStyle = 'rgba(0,0,0,0.6)';
    c2.lineWidth = 2;
    for(let i=1;i<maxHp;i++){
      const x = pad + innerW*(i/maxHp);
      c2.beginPath(); c2.moveTo(x,pad); c2.lineTo(x,pad+innerH); c2.stroke();
    }
    return new THREE.CanvasTexture(cvs);
  }

  function renderBoss3D(b, size, maxHp, bodyMat, isFinal, facingAngle){
    const w = pixelToWorld(b.x+ENTITY_SIZE/2, b.y+ENTITY_SIZE/2);
    const flashing = b.invuln>0 && Math.floor(performance.now()/80)%2===0;
    const s = (size/TILE) * 1.8;
    const g = new THREE.Group();
    const t = performance.now()/1000;
    const pulse = 0.5+0.5*Math.sin(t*2.2);
    const activeMat = flashing ? mat.enemyBody : bodyMat;
    // a gentle hover bob, applied only to the ship's own parts (not its
    // ground shadow or health bar) so it visibly floats rather than rolls
    const hover = Math.sin(t*2.4)*0.05*s;

    const shadow = new THREE.Mesh(geo.ring, basicMat(0x000000, {transparent:true, opacity:0.3, side:THREE.DoubleSide}));
    shadow.rotation.x = -Math.PI/2;
    shadow.scale.set(s*0.6,s*0.6,1);
    shadow.position.y = 0.015;
    g.add(shadow);

    // main saucer body - a wide flattened disc
    const saucer = new THREE.Mesh(geo.sphere, activeMat);
    saucer.scale.set(s*0.62, s*0.16, s*0.62);
    saucer.position.y = s*0.46+hover;
    g.add(saucer);

    // lower belly cone (the classic tapered underside)
    const belly = new THREE.Mesh(geo.sphere, activeMat);
    belly.scale.set(s*0.3, s*0.14, s*0.3);
    belly.position.y = s*0.36+hover;
    g.add(belly);

    // a short translucent riser lifting the cockpit dome clear of the
    // saucer's disc, so whatever's inside the dome reads as sitting up on
    // top of the ship rather than buried inside its hull
    const riser = new THREE.Mesh(geo.cylinder, basicMat(0x9be8ff, {transparent:true, opacity:0.28}));
    riser.scale.set(s*0.2, s*0.24, s*0.2);
    riser.position.y = s*0.66+hover;
    g.add(riser);

    // upper glass dome cockpit - translucent and roomy, so the alien rider
    // inside is clearly and unmistakably visible through it
    const dome = new THREE.Mesh(geo.sphere, basicMat(0x9be8ff, {transparent:true, opacity:0.26}));
    dome.scale.set(s*0.44, s*0.42, s*0.44);
    dome.position.y = s*0.94+hover;
    g.add(dome);
    const domeRim = new THREE.Mesh(geo.ring, basicMat(0x222222, {transparent:true, opacity:0.7, side:THREE.DoubleSide}));
    domeRim.rotation.x = -Math.PI/2;
    domeRim.scale.set(s*0.33,s*0.33,1);
    domeRim.position.y = s*0.76+hover;
    g.add(domeRim);

    // a single forward-facing scanner lens on the saucer's rim, doubling
    // as the ship's "eye" and as a clear visual cue for which way it faces
    const lens = new THREE.Mesh(geo.sphere, mat.bossEye);
    lens.scale.set(s*0.11,s*0.11,s*0.045);
    lens.position.set(0, s*0.46+hover, s*0.6);
    g.add(lens);
    const lensRing = new THREE.Mesh(geo.ring, basicMat(0x111111, {transparent:true, opacity:0.85, side:THREE.DoubleSide}));
    lensRing.scale.set(s*0.16,s*0.16,1);
    lensRing.position.set(0, s*0.46+hover, s*0.61);
    g.add(lensRing);
    const eyeLight = new THREE.PointLight(0xff2020, 0.9, 3);
    eyeLight.position.set(0, s*0.46+hover, s*0.55);
    g.add(eyeLight);

    // slowly-spinning collar ring around the base of the dome, standing in
    // for the old radar dish - still reads as "scanning" tech
    const collar = new THREE.Mesh(geo.ring, basicMat(0xaaaaaa, {transparent:true, opacity:0.8, side:THREE.DoubleSide}));
    collar.scale.set(s*0.3,s*0.3,1);
    collar.position.y = s*0.72+hover;
    collar.rotation.x = -Math.PI/2 + Math.sin(t*1.4)*0.15;
    collar.rotation.z = t*1.2;
    g.add(collar);

    // pulsing amber warning beacon at the very top
    const beacon = new THREE.Mesh(geo.sphere, basicMat(0xffaa00, {transparent:true, opacity:0.6+0.4*pulse}));
    beacon.scale.set(s*0.07,s*0.07,s*0.07);
    beacon.position.set(0, s*1.18+hover, 0);
    g.add(beacon);

    // an under-glow disc beneath the saucer, selling the hover effect
    const underGlow = new THREE.Mesh(geo.ring, basicMat(0x66ccff, {transparent:true, opacity:0.35+0.15*pulse, side:THREE.DoubleSide}));
    underGlow.rotation.x = -Math.PI/2;
    underGlow.scale.set(s*0.5,s*0.5,1);
    underGlow.position.y = s*0.28+hover;
    g.add(underGlow);
    const underLight = new THREE.PointLight(0x66ccff, 0.7, 2.4);
    underLight.position.y = s*0.3+hover;
    g.add(underLight);

    if(!isFinal){
      // the true boss is secretly piloting this saucer - seated right up
      // inside the roomy glass dome atop the riser, clearly visible the
      // whole time so its identity is never really much of a mystery
      const rider = makeAlienBossMesh();
      rider.scale.set(0.5,0.5,0.5);
      rider.position.set(0, s*0.58+hover, 0);
      g.add(rider);
    }

    // health bar - a canvas-drawn sprite, always billboarded to face the
    // camera, so it's clearly readable no matter the viewing angle
    const barTex = makeHpBarTexture(b.hp, maxHp);
    const bar = new THREE.Sprite(new THREE.SpriteMaterial({ map:barTex, depthTest:false }));
    bar.scale.set(1.3, 0.22, 1);
    bar.position.set(0, s*1.7, 0);
    bar.renderOrder = 999;
    g.add(bar);

    if(facingAngle!==undefined && facingAngle!==null){
      if(b._facingAngle===undefined) b._facingAngle = facingAngle;
      let diff = facingAngle - b._facingAngle;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      b._facingAngle += diff*0.15;
      g.rotation.y = b._facingAngle;
    }

    g.position.set(w.x, 0, w.z);
    dynamicGroup.add(g);
  }

  // The wrecked UFO for the stage-4 cutscene: keeps the real first boss's
  // silhouette (saucer, riser, dome, collar, lens) so it's still clearly
  // recognizable, just dimmed, tilted, and smoking - it never explodes,
  // and its cockpit sits empty now that the true boss has already left it.
  function renderUfoWreck(wx, wz){
    const s = (BOSS_SIZE/TILE) * 1.8;
    const t = performance.now()/1000;
    const dimMat = stdMat(0x145654, 0x061615, {metalness:0.5, roughness:0.5});
    const tiltX = 0.16, tiltZ = 0.22;

    const shadow = new THREE.Mesh(geo.ring, basicMat(0x000000, {transparent:true, opacity:0.3, side:THREE.DoubleSide}));
    shadow.rotation.x = -Math.PI/2;
    shadow.scale.set(s*0.6,s*0.6,1);
    shadow.position.set(wx, 0.015, wz);
    dynamicGroup.add(shadow);

    const saucer = new THREE.Mesh(geo.sphere, dimMat);
    saucer.scale.set(s*0.62, s*0.16, s*0.62);
    saucer.position.set(wx, s*0.46, wz);
    saucer.rotation.x = tiltX; saucer.rotation.z = tiltZ;
    dynamicGroup.add(saucer);

    const belly = new THREE.Mesh(geo.sphere, dimMat);
    belly.scale.set(s*0.3, s*0.14, s*0.3);
    belly.position.set(wx, s*0.36, wz);
    belly.rotation.x = tiltX; belly.rotation.z = tiltZ;
    dynamicGroup.add(belly);

    const riser = new THREE.Mesh(geo.cylinder, basicMat(0x6a9098, {transparent:true, opacity:0.22}));
    riser.scale.set(s*0.2, s*0.24, s*0.2);
    riser.position.set(wx+Math.sin(tiltZ)*s*0.2, s*0.66, wz-Math.sin(tiltX)*s*0.1);
    riser.rotation.x = tiltX; riser.rotation.z = tiltZ;
    dynamicGroup.add(riser);

    // the dome, empty now, cracked and barely glowing
    const dome = new THREE.Mesh(geo.sphere, basicMat(0x4a6a70, {transparent:true, opacity:0.24}));
    dome.scale.set(s*0.44, s*0.42, s*0.44);
    dome.position.set(wx+Math.sin(tiltZ)*s*0.32, s*0.9, wz-Math.sin(tiltX)*s*0.16);
    dynamicGroup.add(dome);
    const domeRim = new THREE.Mesh(geo.ring, basicMat(0x111111, {transparent:true, opacity:0.7, side:THREE.DoubleSide}));
    domeRim.rotation.x = -Math.PI/2+tiltX;
    domeRim.scale.set(s*0.33,s*0.33,1);
    domeRim.position.set(wx+Math.sin(tiltZ)*s*0.28, s*0.72, wz-Math.sin(tiltX)*s*0.14);
    dynamicGroup.add(domeRim);

    const collar = new THREE.Mesh(geo.ring, basicMat(0x777777, {transparent:true, opacity:0.6, side:THREE.DoubleSide}));
    collar.scale.set(s*0.3,s*0.3,1);
    collar.position.set(wx, s*0.68, wz);
    collar.rotation.x = -Math.PI/2+tiltX*1.4;
    collar.rotation.z = t*0.4; // still limply spinning
    dynamicGroup.add(collar);

    // the scanner lens, dead and dark
    const lens = new THREE.Mesh(geo.sphere, basicMat(0x222222));
    lens.scale.set(s*0.11,s*0.11,s*0.045);
    lens.position.set(wx, s*0.46, wz+s*0.6);
    lens.rotation.x = tiltX;
    dynamicGroup.add(lens);

    // rising smoke, thicker right after the beam grabs the player
    const smokeCount = 7;
    for(let i=0;i<smokeCount;i++){
      const phase = (t*0.28 + i/smokeCount) % 1;
      const sy = s*0.9 + phase*2.6;
      const sx = wx + Math.sin(t*0.45+i)*0.18;
      const sz = wz + Math.cos(t*0.4+i)*0.18;
      const sc = 0.18+phase*0.5;
      const puff = new THREE.Mesh(geo.sphere, basicMat(0x333333, {transparent:true, opacity:0.42*(1-phase)}));
      puff.scale.set(sc,sc,sc);
      puff.position.set(sx, sy, sz);
      dynamicGroup.add(puff);
    }
    // an occasional electrical spark along the hull
    if(Math.random()<0.35){
      const spark = new THREE.Mesh(geo.sphere, basicMat(0xffaa00, {transparent:true, opacity:0.85}));
      spark.scale.set(0.06,0.06,0.06);
      spark.position.set(wx+(Math.random()-0.5)*s*0.7, s*0.4+Math.random()*s*0.3, wz+(Math.random()-0.5)*s*0.7);
      dynamicGroup.add(spark);
    }
    const emberLight = new THREE.PointLight(0xff8833, 0.65, 2.6);
    emberLight.position.set(wx, s*0.5, wz);
    dynamicGroup.add(emberLight);
  }

  function draw(){
    // clear last frame's dynamic (per-frame-rebuilt) meshes
    while(dynamicGroup.children.length){
      const obj = dynamicGroup.children.pop();
      dynamicGroup.remove(obj);
    }

    // items - a clear emoji icon (fire/roller-skate/bomb) gently floating,
    // with a soft ground shadow - no extra glow/rings so it stays simple
    // and the icon itself does the work of telling them apart
    const bob = Math.sin(performance.now()/260)*0.06;
    for(const it of items){
      const w = cellCenterToWorld(it.gx, it.gy);
      if(TREASURE_INFO[it.type]){
        // a small proper 3D model (ring/earring/necklace/gold bar), gently
        // spinning and bobbing so it reads as a real treasure sitting there
        const tmesh = makeTreasureMesh(it.type);
        tmesh.position.set(w.x, 0.42+bob, w.z);
        tmesh.rotation.y = performance.now()/900;
        dynamicGroup.add(tmesh);
        const tglow = makeGlowSprite(0xffe066, 0.9);
        tglow.position.set(w.x, 0.42+bob, w.z);
        dynamicGroup.add(tglow);
      } else {
        const iconSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: itemTextures[it.type], transparent:true }));
        iconSprite.scale.set(0.95,0.95,1);
        iconSprite.position.set(w.x, 0.5+bob, w.z);
        dynamicGroup.add(iconSprite);
      }
      const shadow = new THREE.Mesh(geo.ring, basicMat(0x000000, {transparent:true, opacity:0.22, side:THREE.DoubleSide}));
      shadow.rotation.x = -Math.PI/2;
      shadow.scale.set(0.4,0.4,1);
      shadow.position.set(w.x, 0.015, w.z);
      dynamicGroup.add(shadow);
    }

    // explosions - warm energy blast slabs, classic fire coloring
    for(const ex of explosions){
      const alpha = Math.max(0, ex.timer/EXPLOSION_DURATION);
      const coreSet = ex.core3x3 ? new Set(ex.core3x3.map(c=>c.gx+','+c.gy)) : null;
      for(const c of ex.cells){
        const w = cellCenterToWorld(c.gx, c.gy);
        const isCore = coreSet && coreSet.has(c.gx+','+c.gy);
        if(isCore){
          // the Dangerous Bomb's 5x5 core - noticeably bigger and tinted
          // purple/green so it's unmistakably a different, heavier blast
          // than the thin cross reaching across the rest of the row/column
          const outer = new THREE.Mesh(geo.box, basicMat(0x9dff5a, {transparent:true, opacity:0.5*alpha+0.15}));
          outer.scale.set(1.0, 0.1+0.55*alpha, 1.0);
          outer.position.set(w.x, 0.06+0.24*alpha, w.z);
          dynamicGroup.add(outer);
          const inner = new THREE.Mesh(geo.box, basicMat(0x8a3ad0, {transparent:true, opacity:0.75*alpha}));
          inner.scale.set(0.72,0.55+0.55*alpha,0.72);
          inner.position.set(w.x, 0.24+0.28*alpha, w.z);
          dynamicGroup.add(inner);
          continue;
        }
        const outer = new THREE.Mesh(geo.box, mat.explosionOuter.clone());
        outer.material.opacity = 0.45*alpha+0.1;
        outer.scale.set(0.9, 0.06+0.3*alpha, 0.9);
        outer.position.set(w.x, 0.05+0.15*alpha, w.z);
        dynamicGroup.add(outer);
        const inner = new THREE.Mesh(geo.box, mat.explosionInner.clone());
        inner.material.opacity = 0.6*alpha;
        inner.scale.set(0.5,0.4+0.4*alpha,0.5);
        inner.position.set(w.x, 0.2+0.2*alpha, w.z);
        dynamicGroup.add(inner);
      }
    }

    // bombs - classic look: a plain dark sphere with a small fuse spark on
    // top, no glow or rings, so it doesn't visually compete with anything
    for(const b of bombs){
      const w = pixelToWorld(b.cx, b.cy);
      const pulse = 1 + 0.12*Math.sin(performance.now()/100);
      const isTrueBossBomb = b.owner===trueBoss || b.owner===hiddenBoss;
      if(b.dangerous){
        // the hidden boss's "Dangerous Bomb" - a classic Bomberman nod:
        // jet-black shell, a little skull face, and sickly purple-green
        // sparks/glow instead of the usual red, plus a pulsing warning
        // ring on the floor so it reads as unmistakably different (and it
        // also has a much shorter fuse than a normal bomb)
        const dpulse = 1 + 0.22*Math.sin(performance.now()/70);
        const body = new THREE.Mesh(geo.sphere, basicMat(0x151018));
        body.scale.set(0.56*dpulse,0.56*dpulse,0.56*dpulse);
        body.position.set(w.x, 0.5, w.z);
        dynamicGroup.add(body);
        // skull face: two eye sockets + a small nose divot
        const eyeMat = basicMat(0xd8ffb0);
        const eyeL = new THREE.Mesh(geo.sphere, eyeMat);
        eyeL.scale.set(0.09,0.09,0.05);
        eyeL.position.set(w.x-0.16, 0.56, w.z+0.5);
        dynamicGroup.add(eyeL);
        const eyeR = new THREE.Mesh(geo.sphere, eyeMat);
        eyeR.scale.set(0.09,0.09,0.05);
        eyeR.position.set(w.x+0.16, 0.56, w.z+0.5);
        dynamicGroup.add(eyeR);
        const fuseTip = new THREE.Mesh(geo.sphere, basicMat(0x9dff5a));
        fuseTip.scale.set(0.15,0.15,0.15);
        fuseTip.position.set(w.x, 0.5+0.56*dpulse*0.95, w.z);
        dynamicGroup.add(fuseTip);
        const glow = makeGlowSprite(0x8a3ad0, 2.4);
        glow.position.set(w.x, 0.5, w.z);
        dynamicGroup.add(glow);
        const light = new THREE.PointLight(0x9dff5a, 0.9, 2.2);
        light.position.set(w.x, 0.4, w.z);
        dynamicGroup.add(light);
        const warnRing = new THREE.Mesh(geo.ring, basicMat(0x9dff5a, {transparent:true, opacity:0.35+0.2*Math.sin(performance.now()/90), side:THREE.DoubleSide}));
        warnRing.rotation.x = -Math.PI/2;
        warnRing.scale.set(0.7,0.7,1);
        warnRing.position.set(w.x, 0.02, w.z);
        dynamicGroup.add(warnRing);
        continue;
      }
      const sparkColor = isTrueBossBomb ? 0xff2020 : 0xdddddd;
      const body = new THREE.Mesh(geo.sphere, isTrueBossBomb ? mat.trueBossBomb : mat.bomb);
      body.scale.set(0.52*pulse,0.52*pulse,0.52*pulse);
      body.position.set(w.x, 0.5, w.z);
      dynamicGroup.add(body);
      const highlight = new THREE.Mesh(geo.sphere, basicMat(0xffffff, {transparent:true, opacity:isTrueBossBomb?0.3:0.5}));
      highlight.scale.set(0.11,0.11,0.11);
      highlight.position.set(w.x-0.14, 0.68, w.z+0.14);
      dynamicGroup.add(highlight);
      const fuseTip = new THREE.Mesh(geo.sphere, basicMat(sparkColor));
      fuseTip.scale.set(isTrueBossBomb?0.13:0.1, isTrueBossBomb?0.13:0.1, isTrueBossBomb?0.13:0.1);
      fuseTip.position.set(w.x, 0.5+0.52*pulse*0.95, w.z);
      dynamicGroup.add(fuseTip);
      if(isTrueBossBomb){
        // a faint red under-glow specifically for the true boss's bombs -
        // the one deliberate exception, so they're unmistakable
        const light = new THREE.PointLight(0xff2020, 0.5, 1.6);
        light.position.set(w.x, 0.4, w.z);
        dynamicGroup.add(light);
      }
    }

    // boss projectiles - flown above wall height so they stay visible while
    // passing straight through walls/blocks, matching how they actually
    // behave in the game (they pierce everything)
    for(const p of projectiles){
      const w = pixelToWorld(p.x, p.y);
      if(p.isTrueBossRay){
        // the true boss's one-shot ray gun blast - a genuine laser beam
        // trailing behind the traveling hit-point, unmistakably red
        renderBeamSegment(p.x - p.dx*130, p.y - p.dy*130, p.x, p.y, 0xff2020, 0.16, 1, 1.15);
        const bolt = new THREE.Mesh(geo.sphere, basicMat(0xffffff));
        bolt.scale.set(0.22,0.22,0.22);
        bolt.position.set(w.x, 1.15, w.z);
        dynamicGroup.add(bolt);
        const boltGlow = makeGlowSprite(0xff2020, 1.8);
        boltGlow.position.set(w.x, 1.15, w.z);
        dynamicGroup.add(boltGlow);
        const boltLight = new THREE.PointLight(0xff2020, 1.1, 2.6);
        boltLight.position.set(w.x, 1.15, w.z);
        dynamicGroup.add(boltLight);
        continue;
      }
      const wTrail = pixelToWorld(p.x - p.dx*6, p.y - p.dy*6);
      const trail = new THREE.Mesh(geo.sphere, basicMat(0xff7828, {transparent:true, opacity:0.35}));
      trail.scale.set(0.28,0.28,0.28);
      trail.position.set(wTrail.x, 1.15, wTrail.z);
      dynamicGroup.add(trail);
      const bolt = new THREE.Mesh(geo.sphere, mat.projectile);
      bolt.scale.set(0.18,0.18,0.18);
      bolt.position.set(w.x, 1.15, w.z);
      dynamicGroup.add(bolt);
    }

    // enemies
    for(const en of enemies){
      if(!en.alive) continue;
      if(!en.mesh3d) en.mesh3d = makeCharacterMesh(mat.enemyBody, mat.enemyVisor, 0xffb3b3, true);
      renderCharacter3D(en, en.mesh3d, false, Math.atan2(en.dir.dx, en.dir.dy));
    }

    // first boss
    if(stage===3 && boss && boss.alive){
      renderBoss3D(boss, BOSS_SIZE, BOSS_HP, mat.bossBody, false, Math.atan2(boss.dir.dx, boss.dir.dy));
    }

    // true boss - a space lifeform, deliberately unlike anything mechanical
    // seen so far, matching the player's size
    if(stage===5 && trueBoss && trueBoss.alive){
      if(!trueBoss.mesh3d) trueBoss.mesh3d = makeAlienBossMesh(false, 'single');
      renderCharacter3D(trueBoss, trueBoss.mesh3d, false, Math.atan2(trueBoss.faceDx||0, trueBoss.faceDy||1));
      const w = pixelToWorld(trueBoss.x+ENTITY_SIZE/2, trueBoss.y+ENTITY_SIZE/2);
      const barTex = makeHpBarTexture(trueBoss.hp, TRUEBOSS_HP);
      const bar = new THREE.Sprite(new THREE.SpriteMaterial({ map:barTex, depthTest:false }));
      bar.scale.set(1.2, 0.2, 1);
      bar.position.set(w.x, 2.7, w.z);
      bar.renderOrder = 999;
      dynamicGroup.add(bar);
    }

    // the hidden final boss - the true boss's own master: same alien
    // design, one size bigger, and crowned
    if(stage===9 && hiddenBoss && hiddenBoss.alive){
      if(!hiddenBoss.mesh3d){
        hiddenBoss.mesh3d = makeAlienBossMesh(true, 'dual');
        hiddenBoss.mesh3d.scale.set(1.2,1.2,1.2);
      }
      renderCharacter3D(hiddenBoss, hiddenBoss.mesh3d, false, Math.atan2(hiddenBoss.faceDx||0, hiddenBoss.faceDy||1));
      const w = pixelToWorld(hiddenBoss.x+ENTITY_SIZE/2, hiddenBoss.y+ENTITY_SIZE/2);
      const barTex = makeHpBarTexture(hiddenBoss.hp, HIDDENBOSS_HP);
      const bar = new THREE.Sprite(new THREE.SpriteMaterial({ map:barTex, depthTest:false }));
      bar.scale.set(1.3, 0.22, 1);
      bar.position.set(w.x, 4.2, w.z);
      bar.renderOrder = 999;
      dynamicGroup.add(bar);

      // last-stand shield bubble - blocks bomb damage entirely until the
      // destroy ray strips it away
      if(hiddenBoss.phase==='cage' && hiddenBoss.shieldActive){
        const st = performance.now()/220;
        const spulse = 0.92+0.12*Math.sin(st);
        const shieldBubble = new THREE.Mesh(geo.sphere, basicMat(0x9d4dff, {transparent:true, opacity:0.48+0.14*Math.sin(st*1.4)}));
        shieldBubble.scale.set(1.85*spulse, 2.15*spulse, 1.85*spulse);
        shieldBubble.position.set(w.x, 1.3, w.z);
        dynamicGroup.add(shieldBubble);
        // a brighter wireframe shell on top so the edge of the shield reads
        // clearly even against similarly-colored backgrounds
        const shieldWire = new THREE.Mesh(geo.sphere, new THREE.MeshBasicMaterial({ color:0xd9b3ff, wireframe:true, transparent:true, opacity:0.55 }));
        shieldWire.scale.set(1.9*spulse, 2.2*spulse, 1.9*spulse);
        shieldWire.position.set(w.x, 1.3, w.z);
        dynamicGroup.add(shieldWire);
        const shieldBubbleGlow = makeGlowSprite(0x9d4dff, 4.2);
        shieldBubbleGlow.position.set(w.x, 1.3, w.z);
        dynamicGroup.add(shieldBubbleGlow);
        const shieldBubbleLight = new THREE.PointLight(0x9d4dff, 1.6, 4.5);
        shieldBubbleLight.position.set(w.x, 1.3, w.z);
        dynamicGroup.add(shieldBubbleLight);
      }

      // the last-stand laser "mouth": two beams, symmetric around the
      // boss's forward direction, starting as a straight 180-degree
      // sideways line and slowly rotating inward until they meet, closed,
      // pointing straight ahead - like a Pac-Man mouth biting shut
      if(hiddenBoss.phase==='cage'){
        const halfAngle = hiddenBoss.cageHalfAngle;
        const bossPixelX = hiddenBoss.x+ENTITY_SIZE/2, bossPixelY = hiddenBoss.y+ENTITY_SIZE/2;
        const beamLen = 900;
        const dirA = { dx: Math.sin(halfAngle), dy: Math.cos(halfAngle) };
        const dirB = { dx: Math.sin(-halfAngle), dy: Math.cos(-halfAngle) };
        renderBeamSegment(bossPixelX, bossPixelY, bossPixelX+dirA.dx*beamLen, bossPixelY+dirA.dy*beamLen, 0xff2020, 0.16, 1, 0.75);
        renderBeamSegment(bossPixelX, bossPixelY, bossPixelX+dirB.dx*beamLen, bossPixelY+dirB.dy*beamLen, 0xff2020, 0.16, 1, 0.75);
        const bw = pixelToWorld(bossPixelX, bossPixelY);
        const mouthLight = new THREE.PointLight(0xff2020, 1.2, 4.2);
        mouthLight.position.set(bw.x, 0.75, bw.z);
        dynamicGroup.add(mouthLight);
        // the closing-in warning ring at the boss's feet, pulsing faster
        // and glowing hotter the closer the mouth gets to fully shutting
        const closeness = 1 - halfAngle/(Math.PI/2);
        const pt = performance.now()/1000;
        const warnRing = new THREE.Mesh(geo.ring, basicMat(0xff2020, {transparent:true, opacity:0.35+0.35*closeness, side:THREE.DoubleSide}));
        warnRing.rotation.x = -Math.PI/2;
        const warnS = 0.7+0.15*Math.sin(pt*(4+closeness*8));
        warnRing.scale.set(warnS, warnS, 1);
        warnRing.position.set(bw.x, 0.04, bw.z);
        dynamicGroup.add(warnRing);
      }
    }

    // the destroy ray - a brief, powerful straight-line beam fired in
    // whichever direction the player's currently facing
    if(destroyRayBeam){
      const alpha = Math.max(0, destroyRayBeam.timer/0.3);
      const endPx = destroyRayBeam.x + destroyRayBeam.dx*700;
      const endPy = destroyRayBeam.y + destroyRayBeam.dy*700;
      renderBeamSegment(destroyRayBeam.x, destroyRayBeam.y, endPx, endPy, 0xff2020, 0.15, alpha, 1.1);
      const muzzleGlow = makeGlowSprite(0xff2020, 1.6*alpha+0.3);
      const mw = pixelToWorld(destroyRayBeam.x, destroyRayBeam.y);
      muzzleGlow.position.set(mw.x, 1.1, mw.z);
      dynamicGroup.add(muzzleGlow);
      const muzzleLight = new THREE.PointLight(0xff2020, 1.0*alpha, 3);
      muzzleLight.position.set(mw.x, 1.1, mw.z);
      dynamicGroup.add(muzzleLight);
    }

    // the crown-crack hit-flash: a big, unmistakable burst right at the
    // hidden boss's (or its crown's) position the instant the destroy ray
    // connects, with the crown's shards visibly flying off
    if(crownCrackEffectTimer>0){
      const flashAlpha = Math.max(0, Math.min(1, crownCrackEffectTimer/0.7));
      const overallAlpha = Math.max(0, Math.min(1, crownCrackEffectTimer/1.8));
      let fx=null, fz=null;
      if(hiddenBoss && hiddenBoss.alive){
        const fw = pixelToWorld(hiddenBoss.x+ENTITY_SIZE/2, hiddenBoss.y+ENTITY_SIZE/2);
        fx = fw.x; fz = fw.z;
      } else if(crownPos){
        const fw = cellCenterToWorld(crownPos.gx, crownPos.gy);
        fx = fw.x; fz = fw.z;
      }
      if(fx!==null){
        const crackFlash = makeGlowSprite(0xffffff, 3.8*flashAlpha+0.4);
        crackFlash.position.set(fx, 2.3, fz);
        dynamicGroup.add(crackFlash);
        const crackLight = new THREE.PointLight(0xffffff, 2.0*flashAlpha, 4);
        crackLight.position.set(fx, 2.3, fz);
        dynamicGroup.add(crackLight);
        // an expanding golden shockwave ring
        const elapsedCrack = 1.8 - crownCrackEffectTimer;
        const ringR = 0.3 + elapsedCrack*2.2;
        const shockRing = new THREE.Mesh(geo.ring, basicMat(0xffd75e, {transparent:true, opacity:0.7*overallAlpha, side:THREE.DoubleSide}));
        shockRing.rotation.x = -Math.PI/2;
        shockRing.scale.set(ringR, ringR, 1);
        shockRing.position.set(fx, 2.3, fz);
        dynamicGroup.add(shockRing);
        // tumbling gold crown-shard debris, flung outward from the break
        const shardCount = 8;
        for(let i=0;i<shardCount;i++){
          const ang = (i/shardCount)*Math.PI*2 + i*0.7;
          const shardDist = elapsedCrack*1.8;
          const shardY = Math.max(0.2, 2.3 + elapsedCrack*1.4 - elapsedCrack*elapsedCrack*3.2);
          const shard = new THREE.Mesh(geo.box, basicMat(0xffd75e, {transparent:true, opacity:overallAlpha}));
          shard.scale.set(0.07,0.1,0.07);
          shard.position.set(fx+Math.cos(ang)*shardDist, shardY, fz+Math.sin(ang)*shardDist);
          shard.rotation.set(elapsedCrack*6+i, elapsedCrack*4+i, elapsedCrack*5);
          dynamicGroup.add(shard);
        }
      }
    }

    // the shield-break hit-flash: a smaller purple burst when the destroy
    // ray only strips the shield rather than directly hitting the boss -
    // the crown stays on, so this deliberately looks different/lesser
    // than the golden crown-crack burst above
    if(shieldBreakEffectTimer>0 && hiddenBoss && hiddenBoss.alive){
      const sAlpha = Math.max(0, Math.min(1, shieldBreakEffectTimer/0.7));
      const sw = pixelToWorld(hiddenBoss.x+ENTITY_SIZE/2, hiddenBoss.y+ENTITY_SIZE/2);
      const shieldFlash = makeGlowSprite(0x8a3ad0, 2.6*sAlpha+0.3);
      shieldFlash.position.set(sw.x, 1.3, sw.z);
      dynamicGroup.add(shieldFlash);
      const shieldFlashLight = new THREE.PointLight(0x8a3ad0, 1.4*sAlpha, 3.2);
      shieldFlashLight.position.set(sw.x, 1.3, sw.z);
      dynamicGroup.add(shieldFlashLight);
    }

    // the true boss's dropped ray gun, waiting to be picked up
    if((stage===6 || stage===7) && rayGunPos && !rayGunTaken){
      const w = cellCenterToWorld(rayGunPos.gx, rayGunPos.gy);
      const bob = Math.sin(performance.now()/300)*0.07;
      const gunMat = stdMat(0x555566, 0x222233, {roughness:0.3, metalness:0.6});
      const gunBody = new THREE.Mesh(geo.box, gunMat);
      gunBody.scale.set(0.22,0.16,0.5);
      gunBody.position.set(w.x, 0.5+bob, w.z);
      gunBody.rotation.y = performance.now()/900;
      dynamicGroup.add(gunBody);
      const gunBarrel = new THREE.Mesh(geo.cylinder, gunMat);
      gunBarrel.scale.set(0.08,0.35,0.08);
      gunBarrel.rotation.x = Math.PI/2;
      gunBarrel.rotation.y = gunBody.rotation.y;
      gunBarrel.position.set(w.x + Math.sin(gunBody.rotation.y)*0.3, 0.5+bob, w.z + Math.cos(gunBody.rotation.y)*0.3);
      dynamicGroup.add(gunBarrel);
      const gunGlow = makeGlowSprite(0xff3b3b, 1.4);
      gunGlow.position.set(w.x, 0.5+bob, w.z);
      dynamicGroup.add(gunGlow);
      const gunLight = new THREE.PointLight(0xff3b3b, 0.7, 2.2);
      gunLight.position.set(w.x, 0.5+bob, w.z);
      dynamicGroup.add(gunLight);
      const gunShadow = new THREE.Mesh(geo.ring, basicMat(0x000000, {transparent:true, opacity:0.25, side:THREE.DoubleSide}));
      gunShadow.rotation.x = -Math.PI/2;
      gunShadow.scale.set(0.4,0.4,1);
      gunShadow.position.set(w.x, 0.015, w.z);
      dynamicGroup.add(gunShadow);
    }

    // the warp-zone portals
    if(stage===7 && portals){
      renderPortalHole(portals.white.gx, portals.white.gy, true);
      renderPortalHole(portals.black.gx, portals.black.gy, false);
    }

    // the black hole itself, expanding and spinning ever faster as it
    // pulls the player in during the stage-12 death cutscene
    if(stage===12 && blackHoleDeathTarget){
      const w = pixelToWorld(blackHoleDeathTarget.x, blackHoleDeathTarget.y);
      const t = performance.now()/1000;
      const progress = Math.min(1, 1 - Math.max(0,stageTimer)/BLACKHOLE_DEATH_DURATION);
      const accentColor = blackHoleWarpMode ? 0xffe066 : 0x8a3ad0;
      const growR = 0.55 + progress*3.4;
      const core = new THREE.Mesh(geo.sphere, basicMat(0x05020a, {transparent:true, opacity:0.95}));
      core.scale.set(growR, growR, growR);
      core.position.set(w.x, 0.65, w.z);
      dynamicGroup.add(core);
      for(let i=0;i<4;i++){
        const ringR = growR*0.7 + i*0.25;
        const ring = new THREE.Mesh(geo.ring, basicMat(accentColor, {transparent:true, opacity:0.55-i*0.1, side:THREE.DoubleSide}));
        ring.rotation.x = Math.PI/2.3;
        ring.rotation.z = t*(3+progress*7)*(i%2===0?1:-1);
        ring.scale.set(ringR,ringR,1);
        ring.position.set(w.x, 0.65, w.z);
        dynamicGroup.add(ring);
      }
      // debris/light being torn off and swallowed, spiraling faster near the end
      const debrisCount = 10;
      for(let i=0;i<debrisCount;i++){
        const phase = (t*(1.4+progress*2.2) + i/debrisCount) % 1;
        const r = growR*1.7*(1-phase) + 0.1;
        const ang = i*1.7 + t*(2.5+progress*4);
        const dpx = w.x+Math.cos(ang)*r, dpz = w.z+Math.sin(ang)*r;
        const bit = new THREE.Mesh(geo.box, basicMat(accentColor, {transparent:true, opacity:0.75*(1-phase)}));
        bit.scale.set(0.08,0.08,0.08);
        bit.position.set(dpx, 0.65, dpz);
        dynamicGroup.add(bit);
      }
      const light = new THREE.PointLight(accentColor, 1.3*progress, 6.5);
      light.position.set(w.x, 0.65, w.z);
      dynamicGroup.add(light);
    }

    // the crown left behind after the hidden final boss falls. During
    // stage 10 it's flung high into the air, spinning wildly, before
    // slowly twirling back down to land - a big, unmissable beat since
    // there's no white flash covering it this time. Stage 11 then keeps
    // it gently bobbing at rest until it's picked up.
    if((stage===10 || stage===11) && crownPos && !crownTaken){
      const w = cellCenterToWorld(crownPos.gx, crownPos.gy);
      const t = performance.now()/1000;
      let extraY = 0, spinBoost = 1;
      if(stage===10){
        const elapsedC = HIDDENBOSS_CROWN_DURATION - stageTimer;
        const clamp01 = x=>Math.max(0,Math.min(1,x));
        const easeOut = x=>1-(1-x)*(1-x);
        const easeIn = x=>x*x;
        const LAUNCH_END=1.0, HANG_END=2.3, FALL_END=3.6;
        if(elapsedC<LAUNCH_END){
          extraY = 3.4*easeOut(clamp01(elapsedC/LAUNCH_END));
          spinBoost = 1+clamp01(elapsedC/LAUNCH_END)*8;
        } else if(elapsedC<HANG_END){
          extraY = 3.4;
          spinBoost = 9;
        } else if(elapsedC<FALL_END){
          const p = clamp01((elapsedC-HANG_END)/(FALL_END-HANG_END));
          extraY = 3.4*(1-easeIn(p));
          spinBoost = 9-p*8;
        }
        // a trail of glittering sparks left behind as it rockets up and falls
        if(extraY>0.05){
          const trailCount = 6;
          for(let i=0;i<trailCount;i++){
            const ty = extraY*(1-i/trailCount);
            const spark = new THREE.Mesh(geo.sphere, basicMat(0xffe066, {transparent:true, opacity:0.6*(1-i/trailCount)}));
            spark.scale.set(0.05,0.05,0.05);
            spark.position.set(w.x+Math.sin(t*6+i)*0.12, 0.6+ty, w.z+Math.cos(t*6+i)*0.12);
            dynamicGroup.add(spark);
          }
        }
      }
      const bob = stage===11 ? Math.sin(t*1.6)*0.08 : 0;
      const y = 0.55+bob+extraY;
      const crownMat = basicMat(crownCracked ? 0x8a7248 : 0xffd75e);
      const band = new THREE.Mesh(geo.cylinder, crownMat);
      band.scale.set(0.26,0.09,0.26);
      band.position.set(w.x, y, w.z);
      band.rotation.y = t*1.1*spinBoost;
      band.rotation.x = stage===10 ? Math.sin(t*3)*0.3 : (crownCracked ? Math.PI*0.4 : 0);
      if(crownCracked) band.rotation.z = 0.55; // toppled onto its side, clearly no longer wearable
      dynamicGroup.add(band);
      if(crownCracked){
        // a wide, jagged dark fracture straight through the band
        const crack = new THREE.Mesh(geo.box, basicMat(0x0d0d0d));
        crack.scale.set(0.06,0.13,0.3);
        crack.position.set(w.x, y, w.z);
        crack.rotation.y = band.rotation.y + 0.5;
        crack.rotation.z = band.rotation.z;
        dynamicGroup.add(crack);
        const crackGlow = new THREE.PointLight(0xff3b3b, 0.55, 1.6);
        crackGlow.position.set(w.x, y+0.05, w.z);
        dynamicGroup.add(crackGlow);
        // a couple of shard fragments broken clean off, lying scattered nearby
        for(let i=0;i<3;i++){
          const sAng = i*2.4 + t*0.3;
          const sr = 0.22+i*0.05;
          const shard = new THREE.Mesh(geo.box, basicMat(0x3a2a1a));
          shard.scale.set(0.06, 0.05, 0.09);
          shard.position.set(w.x+Math.cos(sAng)*sr, 0.05+bob*0.4, w.z+Math.sin(sAng)*sr);
          shard.rotation.set(i*1.3, i*2.1, i*0.7);
          dynamicGroup.add(shard);
        }
      }
      const pointCount = crownCracked ? 1 : 5;
      for(let i=0;i<pointCount;i++){
        const angle = (i/pointCount)*Math.PI*2 + t*1.1*spinBoost;
        const px = w.x+Math.cos(angle)*0.2, pz = w.z+Math.sin(angle)*0.2;
        // if cracked, the one surviving spike is bent and gemless - every
        // other spike and every gem is simply gone
        const point = new THREE.Mesh(geo.box, crownMat);
        point.scale.set(0.07, crownCracked?0.08:0.11, 0.07);
        point.position.set(px, y+(crownCracked?0.09:0.13), pz);
        if(crownCracked) point.rotation.z = 0.6;
        dynamicGroup.add(point);
        if(!crownCracked){
          const gem = new THREE.Mesh(geo.sphere, basicMat(0xff3b6b));
          gem.scale.set(0.045,0.045,0.045);
          gem.position.set(px, y+0.21, pz);
          dynamicGroup.add(gem);
        }
      }
      const crownGlow = new THREE.PointLight(crownCracked ? 0x8a7248 : 0xffd75e, stage===10 ? 1.6 : 1.0, stage===10 ? 4.5 : 3);
      crownGlow.position.set(w.x, y+0.05, w.z);
      dynamicGroup.add(crownGlow);
      const glowSprite = makeGlowSprite(crownCracked ? 0x8a7248 : 0xffd75e, stage===10 ? 2.0 : 1.4);
      glowSprite.position.set(w.x, y+0.07, w.z);
      dynamicGroup.add(glowSprite);
    }

    // last-stand desperation attack telegraph, expressed as the whole scene
    // gradually bathing in red instead of a 2D screen overlay
    let targetBgLerp = 0;
    if(stage===5 && trueBoss && trueBoss.alive && trueBoss.phase==='charging'){
      const progress = Math.min(1, 1 - trueBoss.phaseTimer/BOMBRAIN_CHARGE_DURATION);
      targetBgLerp = progress*0.6;
      const w = pixelToWorld(trueBoss.x+ENTITY_SIZE/2, trueBoss.y+ENTITY_SIZE/2);
      const t = performance.now()/1000;

      // a rising column of dark energy that grows taller the closer the
      // attack gets to landing
      const pillarH = 1 + progress*7;
      const pillar = new THREE.Mesh(geo.cylinder, basicMat(0xff2020, {transparent:true, opacity:0.3+0.35*progress}));
      pillar.scale.set(0.22+0.18*progress, pillarH, 0.22+0.18*progress);
      pillar.position.set(w.x, pillarH/2, w.z);
      dynamicGroup.add(pillar);

      // several staggered shockwave rings expanding outward continuously
      const waveCount = 4;
      for(let i=0;i<waveCount;i++){
        const wavePhase = (t*0.9 + i/waveCount) % 1;
        const waveR = 0.3 + wavePhase*(2+progress*11);
        const waveAlpha = (1-wavePhase) * (0.35+0.45*progress);
        const wave = new THREE.Mesh(geo.ring, basicMat(0xff2020, {transparent:true, opacity:waveAlpha, side:THREE.DoubleSide}));
        wave.rotation.x = -Math.PI/2;
        wave.scale.set(waveR, waveR, 1);
        wave.position.set(w.x, 0.04, w.z);
        dynamicGroup.add(wave);
      }

      // dark debris chunks orbiting faster and faster as it charges
      const orbitCount = 6;
      for(let i=0;i<orbitCount;i++){
        const ang = t*(2.5+progress*5) + (i/orbitCount)*Math.PI*2;
        const orbitR = 1.3 - progress*0.55;
        const debris = new THREE.Mesh(geo.box, basicMat(0x2a0000));
        debris.scale.set(0.11,0.11,0.11);
        debris.position.set(w.x+Math.cos(ang)*orbitR, 0.5+Math.sin(ang*2)*0.25, w.z+Math.sin(ang)*orbitR);
        debris.rotation.set(ang, ang*1.3, 0);
        dynamicGroup.add(debris);
      }

      const surgeLight = new THREE.PointLight(0xff0000, 1.6*progress, 5);
      surgeLight.position.set(w.x, 1.2, w.z);
      dynamicGroup.add(surgeLight);

      // the one tile that will survive the bomb rain - deliberately subtle
      // (a small dim blue dot) rather than an obvious beacon, so finding it
      // takes real attention
      if(trueBoss.rainSafeGx!==undefined){
        const sw = cellCenterToWorld(trueBoss.rainSafeGx, trueBoss.rainSafeGy);
        const dotPulse = 0.5+0.25*Math.sin(t*2.4);
        const safeDot = new THREE.Mesh(geo.sphere, basicMat(0x3d8bff, {transparent:true, opacity:0.45+0.2*dotPulse}));
        safeDot.scale.set(0.1,0.1,0.1);
        safeDot.position.set(sw.x, 0.05, sw.z);
        dynamicGroup.add(safeDot);
      }

      // an ominous scatter of bombs raining down over the rest of the map,
      // telegraphing exactly what's about to happen everywhere except the beacon
      const rainCount = 22;
      for(let i=0;i<rainCount;i++){
        const seed = i*137.5;
        const rgx = Math.floor(((Math.sin(seed)*0.5+0.5))*COLS);
        const rgy = Math.floor(((Math.cos(seed*1.3)*0.5+0.5))*ROWS);
        if(rgx===trueBoss.rainSafeGx && rgy===trueBoss.rainSafeGy) continue;
        if(grid[rgy] && grid[rgy][rgx]===1) continue;
        const cw = cellCenterToWorld(rgx, rgy);
        const fallPhase = (t*1.1 + i*0.29) % 1;
        const dropH = 6*(1-fallPhase);
        const bombDrop = new THREE.Sprite(new THREE.SpriteMaterial({ map: itemTextures.bombUp, transparent:true, opacity:0.8*(0.4+0.6*progress) }));
        bombDrop.scale.set(0.5,0.5,1);
        bombDrop.position.set(cw.x, 0.5+dropH, cw.z);
        dynamicGroup.add(bombDrop);
      }
    } else if(stage===5 && trueBoss && trueBoss.phase==='dropping'){
      // bombs have actually landed and are sitting primed for a beat before
      // they all go off together - keep the tension of the reddened sky
      // going, but the real focus now is the bombs themselves
      targetBgLerp = 0.55;
      const t = performance.now()/1000;
      if(trueBoss.rainSafeGx!==undefined){
        const sw = cellCenterToWorld(trueBoss.rainSafeGx, trueBoss.rainSafeGy);
        const dotPulse = 0.5+0.25*Math.sin(t*2.4);
        const safeDot = new THREE.Mesh(geo.sphere, basicMat(0x3d8bff, {transparent:true, opacity:0.45+0.2*dotPulse}));
        safeDot.scale.set(0.1,0.1,0.1);
        safeDot.position.set(sw.x, 0.05, sw.z);
        dynamicGroup.add(safeDot);
      }
      // the primed carpet-bomb bombs themselves - visually real bombs, but
      // deliberately not collidable, so they can't strand the player
      const pulse = 1 + 0.12*Math.sin(performance.now()/100);
      for(const rb of rainBombs){
        const w = pixelToWorld(rb.cx, rb.cy);
        const body = new THREE.Mesh(geo.sphere, mat.trueBossBomb);
        body.scale.set(0.5*pulse,0.5*pulse,0.5*pulse);
        body.position.set(w.x, 0.5, w.z);
        dynamicGroup.add(body);
        const fuseTip = new THREE.Mesh(geo.sphere, basicMat(0xff2020));
        fuseTip.scale.set(0.12,0.12,0.12);
        fuseTip.position.set(w.x, 0.5+0.5*pulse*0.95, w.z);
        dynamicGroup.add(fuseTip);
      }
    } else if(stage===5 && trueBoss && trueBoss.phase==='attacking'){
      targetBgLerp = Math.max(0, trueBoss.phaseTimer/BOMBRAIN_ATTACK_DURATION);
      const w = pixelToWorld(trueBoss.x+ENTITY_SIZE/2, trueBoss.y+ENTITY_SIZE/2);
      const burstProgress = 1 - Math.max(0, trueBoss.phaseTimer/BOMBRAIN_ATTACK_DURATION);
      const burst = new THREE.Mesh(geo.ring, basicMat(0xffffff, {transparent:true, opacity:0.85*(1-burstProgress), side:THREE.DoubleSide}));
      burst.rotation.x = -Math.PI/2;
      const br = 1+burstProgress*20;
      burst.scale.set(br,br,1);
      burst.position.set(w.x, 0.05, w.z);
      dynamicGroup.add(burst);
      const burst2 = new THREE.Mesh(geo.ring, basicMat(0xff2020, {transparent:true, opacity:0.6*(1-burstProgress), side:THREE.DoubleSide}));
      burst2.rotation.x = -Math.PI/2;
      const br2 = Math.max(0.1, br-3);
      burst2.scale.set(br2,br2,1);
      burst2.position.set(w.x, 0.05, w.z);
      dynamicGroup.add(burst2);
    }
    if(spaceMode){
      scene.background = new THREE.Color(0x05040f);
      scene.fog.color = new THREE.Color(0x140a24);
    } else if(stage===12 && blackHoleDeathTarget){
      const progress = Math.min(1, 1 - Math.max(0,stageTimer)/BLACKHOLE_DEATH_DURATION);
      scene.background = new THREE.Color(0xbfe3ff).lerp(new THREE.Color(0x05020a), progress);
      scene.fog.color = new THREE.Color(0x8fd0ea).lerp(new THREE.Color(0x1a0a2a), progress);
    } else {
      bgLerp += (targetBgLerp-bgLerp)*0.3;
      if(bgLerp < 0.015){
        scene.background = skyTexture;
      } else {
        const bg = new THREE.Color(0xbfe3ff).lerp(new THREE.Color(0xff2020), bgLerp);
        scene.background = bg;
      }
      scene.fog.color = new THREE.Color(0x8fd0ea).lerp(new THREE.Color(0xff2020), bgLerp);
    }

    // true boss's dramatic entrance, played out during the stage-4 intro:
    //   A) the first boss's UFO doesn't explode - it sits wrecked and
    //      smoking right where it died, a beam of light stretching out to
    //      lock onto the player
    //   B) a white flash cuts over: the arena itself swaps to the space
    //      theme and the player is repositioned inside it
    //   C) the true boss falls from high above into the new space arena
    //      and lands with an impact right before the fight starts for real
    if(stage===4){
      if(!stage4FX) stage4FX = { cutoverDone: !bossDeathPixelPos };
      const EJECT_START = 0.6, EJECT_END = 1.6;
      const BEAM_START = 1.9, BEAM_BUILD = 1.6;
      const FLASH_START = 3.9, FLASH_FULL = 4.4, FLASH_HOLD_END = 5.0, FLASH_FADE_END = 5.8;
      const FALL_START = bossDeathPixelPos ? FLASH_FULL : 0;
      const FALL_END = FALL_START + 2.3;
      const TOTAL = TRUEBOSS_DESCENT_DURATION;
      const elapsed = Math.max(0, TOTAL - stageTimer);
      const clamp01 = x => Math.max(0, Math.min(1, x));
      const easeIn = x => x*x;

      const centerGx = Math.floor(COLS/2), centerGy = Math.max(1, Math.floor(ROWS/2)-2);
      const landSpot = cellCenterToWorld(centerGx, centerGy);

      // --- Phase A: the wrecked, smoking UFO - the true boss visibly
      // ejects from it and rockets away, then a beam locks onto the player ---
      if(bossDeathPixelPos && elapsed < FLASH_FULL){
        const wreckW = pixelToWorld(bossDeathPixelPos.x, bossDeathPixelPos.y);
        const t = performance.now()/1000;

        renderUfoWreck(wreckW.x, wreckW.z);

        // the true boss bursts out of the dome and rockets off into space,
        // shrinking into the distance as it goes
        if(elapsed >= EJECT_START && elapsed < EJECT_END+0.4){
          if(!stage4FX.ejectTriggered){
            stage4FX.ejectTriggered = true;
            triggerShake(0.3, 6);
            spawnDeathEffect(bossDeathPixelPos.x, bossDeathPixelPos.y, '#aa4dff', 2.0);
            sfx.bossFire();
          }
          if(!stage4FX.ejectMesh) stage4FX.ejectMesh = makeAlienBossMesh();
          const ep = clamp01((elapsed-EJECT_START)/(EJECT_END-EJECT_START));
          const easeInEj = ep*ep;
          const ey = 0.9 + easeInEj*10;
          const exOff = easeInEj*2.6;
          stage4FX.ejectMesh.position.set(wreckW.x+exOff, ey, wreckW.z);
          stage4FX.ejectMesh.rotation.y = elapsed*4;
          const emScale = Math.max(0.12, 1-easeInEj*0.85);
          stage4FX.ejectMesh.scale.set(emScale,emScale,emScale);
          dynamicGroup.add(stage4FX.ejectMesh);
        }

        // the warp beam, stretching from the wreck straight to the player -
        // thick and unmistakably yellow, with a long, clear build-up
        if(elapsed >= BEAM_START && player.alive){
          const pw = pixelToWorld(player.x+ENTITY_SIZE/2, player.y+ENTITY_SIZE/2);
          const beamP = clamp01((elapsed-BEAM_START)/BEAM_BUILD);
          const bx1=wreckW.x, by1=0.78, bz1=wreckW.z, bx2=pw.x, by2=0.55, bz2=pw.z;
          const ddx=bx2-bx1, ddy=by2-by1, ddz=bz2-bz1;
          const dist = Math.sqrt(ddx*ddx+ddy*ddy+ddz*ddz);
          if(dist>0.001){
            const beamOuter = new THREE.Mesh(geo.cylinder, basicMat(0xffe066, {transparent:true, opacity:0.3*beamP}));
            beamOuter.scale.set(0.42*beamP+0.08, dist, 0.42*beamP+0.08);
            beamOuter.position.set((bx1+bx2)/2, (by1+by2)/2, (bz1+bz2)/2);
            const dir = new THREE.Vector3(ddx,ddy,ddz).normalize();
            const beamQuat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
            beamOuter.quaternion.copy(beamQuat);
            dynamicGroup.add(beamOuter);
            const beam = new THREE.Mesh(geo.cylinder, basicMat(0xffe066, {transparent:true, opacity:0.7*beamP}));
            beam.scale.set(0.22*beamP+0.05, dist, 0.22*beamP+0.05);
            beam.position.copy(beamOuter.position);
            beam.quaternion.copy(beamQuat);
            dynamicGroup.add(beam);
            const beamCore = new THREE.Mesh(geo.cylinder, basicMat(0xffffff, {transparent:true, opacity:0.85*beamP}));
            beamCore.scale.set(0.08*beamP+0.02, dist, 0.08*beamP+0.02);
            beamCore.position.copy(beamOuter.position);
            beamCore.quaternion.copy(beamQuat);
            dynamicGroup.add(beamCore);
          }
          const ring = new THREE.Mesh(geo.ring, basicMat(0xffe066, {transparent:true, opacity:0.6*beamP, side:THREE.DoubleSide}));
          ring.rotation.x = -Math.PI/2;
          const ringS = 0.75+0.25*Math.sin(t*4);
          ring.scale.set(ringS, ringS, 1);
          ring.position.set(pw.x, 0.04, pw.z);
          dynamicGroup.add(ring);
          const sparkCount = 14;
          for(let i=0;i<sparkCount;i++){
            const phase = (t*1.6 + i/sparkCount) % 1;
            const r = 0.42*(1-phase*0.6);
            const ang = i*1.7 + t*3;
            const sx = pw.x+Math.cos(ang)*r, sz = pw.z+Math.sin(ang)*r;
            const sy = phase*2.2;
            const sspark = new THREE.Mesh(geo.sphere, basicMat(0xffe066, {transparent:true, opacity:(1-phase)*0.9*beamP}));
            sspark.scale.set(0.06,0.06,0.06);
            sspark.position.set(sx, sy, sz);
            dynamicGroup.add(sspark);
          }
          const warpLight = new THREE.PointLight(0xffe066, 1.4*beamP, 3.8);
          warpLight.position.set(pw.x, 0.8, pw.z);
          dynamicGroup.add(warpLight);
        }
      }

      // --- Phase B: the white flash cutover - a proper flashbang hold, not
      // just a brief peak - then swap the arena to space and reposition the player ---
      if(bossDeathPixelPos && !stage4FX.cutoverDone && elapsed >= FLASH_FULL){
        stage4FX.cutoverDone = true;
        setupSpaceTheme();
        clearAllSoftBlocks();
        buildBoardMeshes();
        bombs = [];
        explosions = [];
        player.gx = Math.floor(COLS/2); player.gy = ROWS-2;
        player.moveDir = { dx:0, dy:0 }; player.progress = 0;
        player.x = player.gx*TILE + (TILE-ENTITY_SIZE)/2;
        player.y = player.gy*TILE + (TILE-ENTITY_SIZE)/2;
        triggerShake(0.4, 7);
      }
      if(bossDeathPixelPos){
        let flashOpacity = 0;
        if(elapsed>=FLASH_START && elapsed<FLASH_FULL) flashOpacity = clamp01((elapsed-FLASH_START)/(FLASH_FULL-FLASH_START));
        else if(elapsed>=FLASH_FULL && elapsed<FLASH_HOLD_END) flashOpacity = 1;
        else if(elapsed>=FLASH_HOLD_END && elapsed<FLASH_FADE_END) flashOpacity = 1-clamp01((elapsed-FLASH_HOLD_END)/(FLASH_FADE_END-FLASH_HOLD_END));
        whiteFlash.style.opacity = String(flashOpacity);
      }

      // --- Phase C: the true boss falls from high above into the new arena ---
      if(elapsed >= FALL_START){
        if(!descentMesh){
          descentMesh = makeAlienBossMesh();
          descentMesh._landed = false;
        }
        const p = clamp01((elapsed-FALL_START)/(FALL_END-FALL_START));
        const y = elapsed>=FALL_END ? 0 : 10*(1-easeIn(p));
        descentMesh.position.set(landSpot.x, Math.max(0,y), landSpot.z);
        descentMesh.rotation.y = elapsed*3;
        descentMesh.visible = true;
        dynamicGroup.add(descentMesh);
        if(elapsed >= FALL_END && !descentMesh._landed){
          descentMesh._landed = true;
          triggerShake(0.4, 8);
          spawnDeathEffect(centerGx*TILE+TILE/2, centerGy*TILE+TILE/2, '#ff3b3b', 2.4);
        }
      }
    }

    // the hidden final boss's own entrance, played out during stage 8: a
    // purple/gold UFO descends to the arena's center, hovers, and the
    // crowned boss itself drops out and lands before the UFO pulls away
    if(stage===8){
      const totalH = KICKBROKEN_MSG_DURATION + HIDDENBOSS_UFO_DURATION;
      const elapsedH = Math.max(0, totalH - stageTimer);
      const clamp01h = x => Math.max(0, Math.min(1, x));
      const easeInH = x => x*x;
      const easeOutH = x => 1-(1-x)*(1-x);
      const hCenterGx = Math.floor(COLS/2), hCenterGy = Math.max(1, Math.floor(ROWS/2)-2);
      const hSpot = cellCenterToWorld(hCenterGx, hCenterGy);

      const UFO_START = KICKBROKEN_MSG_DURATION;
      const UFO_DESCEND_END = UFO_START + 1.2;
      const UFO_HOVER_END = UFO_DESCEND_END + 0.3;
      const BOSS_FALL_END_H = UFO_HOVER_END + 0.8;
      const UFO_LEAVE_END = BOSS_FALL_END_H + 0.6;

      if(elapsedH >= UFO_START){
        let ufoY = 10;
        if(elapsedH < UFO_DESCEND_END){
          const p = clamp01h((elapsedH-UFO_START)/(UFO_DESCEND_END-UFO_START));
          ufoY = 10 - (10-2.4)*easeOutH(p);
        } else if(elapsedH < BOSS_FALL_END_H){
          ufoY = 2.4 + Math.sin(performance.now()/500)*0.1;
        } else {
          const p = clamp01h((elapsedH-BOSS_FALL_END_H)/(UFO_LEAVE_END-BOSS_FALL_END_H));
          ufoY = 2.4 + 9*easeInH(p);
        }
        const ufoOpacity = elapsedH>=BOSS_FALL_END_H ? (1-clamp01h((elapsedH-BOSS_FALL_END_H)/(UFO_LEAVE_END-BOSS_FALL_END_H))) : 1;
        if(ufoOpacity > 0.01){
          const s = 2.2;
          const saucer = new THREE.Mesh(geo.sphere, basicMat(0x3a1a55, {transparent:true, opacity:0.9*ufoOpacity}));
          saucer.scale.set(s*0.62, s*0.16, s*0.62);
          saucer.position.set(hSpot.x, ufoY, hSpot.z);
          dynamicGroup.add(saucer);
          const dome = new THREE.Mesh(geo.sphere, basicMat(0xffd75e, {transparent:true, opacity:0.32*ufoOpacity}));
          dome.scale.set(s*0.4, s*0.36, s*0.4);
          dome.position.set(hSpot.x, ufoY+s*0.42, hSpot.z);
          dynamicGroup.add(dome);
          const ufoUnderGlow = new THREE.Mesh(geo.ring, basicMat(0x8a3ad0, {transparent:true, opacity:0.5*ufoOpacity, side:THREE.DoubleSide}));
          ufoUnderGlow.rotation.x = -Math.PI/2;
          ufoUnderGlow.scale.set(s*0.5, s*0.5, 1);
          ufoUnderGlow.position.set(hSpot.x, ufoY-s*0.14, hSpot.z);
          dynamicGroup.add(ufoUnderGlow);
          const ufoLight = new THREE.PointLight(0x8a3ad0, 1.0*ufoOpacity, 4.2);
          ufoLight.position.set(hSpot.x, ufoY, hSpot.z);
          dynamicGroup.add(ufoLight);
          if(elapsedH < BOSS_FALL_END_H && ufoY>0.3){
            const beam = new THREE.Mesh(geo.cylinder, basicMat(0x8a3ad0, {transparent:true, opacity:0.22*ufoOpacity}));
            beam.scale.set(s*0.3, ufoY, s*0.3);
            beam.position.set(hSpot.x, ufoY/2, hSpot.z);
            dynamicGroup.add(beam);
          }
        }
      }

      // the hidden boss drops out from underneath and falls the rest of the way
      if(elapsedH >= UFO_HOVER_END){
        if(!hiddenDescentMesh){
          hiddenDescentMesh = makeAlienBossMesh(true, 'dual');
          hiddenDescentMesh.scale.set(1.2,1.2,1.2);
          hiddenDescentMesh._landed = false;
        }
        const p = clamp01h((elapsedH-UFO_HOVER_END)/(BOSS_FALL_END_H-UFO_HOVER_END));
        const y = elapsedH>=BOSS_FALL_END_H ? 0 : 2.2*(1-easeInH(p));
        hiddenDescentMesh.position.set(hSpot.x, Math.max(0,y), hSpot.z);
        hiddenDescentMesh.rotation.y = elapsedH*2;
        dynamicGroup.add(hiddenDescentMesh);
        if(elapsedH >= BOSS_FALL_END_H && !hiddenDescentMesh._landed){
          hiddenDescentMesh._landed = true;
          triggerShake(0.35, 7);
          spawnDeathEffect(hCenterGx*TILE+TILE/2, hCenterGy*TILE+TILE/2, '#8a3ad0', 2.0);
        }
      }
    }

    // player
    if(player.alive){
      if(!player.mesh3d) player.mesh3d = makeCharacterMesh(mat.playerBody, mat.playerVisor, 0xaee0ff);
      renderCharacter3D(player, player.mesh3d, player.invincibleTimer>0, facingStringToAngle(player.facing));
      if(player.posing){
        // a little triumphant hop either way, but the sparkle effect
        // differs depending on which crown was actually picked up
        const pt = performance.now()/1000;
        const hop = Math.abs(Math.sin(pt*3))*0.12;
        player.mesh3d.position.y = hop;
        const pw = pixelToWorld(player.x+ENTITY_SIZE/2, player.y+ENTITY_SIZE/2);
        if(crownCracked){
          // no triumphant golden shine for a cracked crown - just a few
          // dull, dark dust motes drifting downward instead of bright
          // sparkles rising up, and no bright glow/light at all
          const dustCount = 6;
          for(let i=0;i<dustCount;i++){
            const phase = (pt*0.5 + i/dustCount) % 1;
            const ang = i*2.9 + pt*0.6;
            const r = 0.4 + phase*0.25;
            const sy = 1.05 - phase*0.85;
            const dust = new THREE.Mesh(geo.sphere, basicMat(0x6b6152, {transparent:true, opacity:0.45*(1-phase)}));
            dust.scale.set(0.045,0.045,0.045);
            dust.position.set(pw.x+Math.cos(ang)*r, sy, pw.z+Math.sin(ang)*r);
            dynamicGroup.add(dust);
          }
          const poseGlow = makeGlowSprite(0x6b6152, 1.0);
          poseGlow.position.set(pw.x, 0.9, pw.z);
          dynamicGroup.add(poseGlow);
        } else {
          // a rising ring of golden sparkles around the player while they
          // hold the victory pose
          const sparkCount = 10;
          for(let i=0;i<sparkCount;i++){
            const phase = (pt*0.7 + i/sparkCount) % 1;
            const ang = i*2.4 + pt*1.5;
            const r = 0.5 + phase*0.3;
            const sy = 0.3 + phase*1.6;
            const spark = new THREE.Mesh(geo.sphere, basicMat(0xffe066, {transparent:true, opacity:0.8*(1-phase)}));
            spark.scale.set(0.055,0.055,0.055);
            spark.position.set(pw.x+Math.cos(ang)*r, sy, pw.z+Math.sin(ang)*r);
            dynamicGroup.add(spark);
          }
          const poseGlow = makeGlowSprite(0xffe066, 2.4);
          poseGlow.position.set(pw.x, 1.1, pw.z);
          dynamicGroup.add(poseGlow);
          const poseLight = new THREE.PointLight(0xffe066, 1.0, 3.2);
          poseLight.position.set(pw.x, 1.1, pw.z);
          dynamicGroup.add(poseLight);
        }
      }
    }

    syncBlockDebris3D();
    syncDeathEffects3D();

    // camera shake
    if(shakeTimer>0){
      const sx = (Math.random()*2-1)*shakeMagnitude*shakeTimer*0.05;
      const sy = (Math.random()*2-1)*shakeMagnitude*shakeTimer*0.05;
      camera.position.set(cameraBase.x+sx, cameraBase.y+sy, cameraBase.z);
    } else {
      camera.position.copy(cameraBase);
    }

    renderer.render(scene, camera);
  }

  function loop(now){
    const dt = Math.min((now-lastTime)/1000, 0.05);
    lastTime = now;
    update(dt);
    updateDeathEffects(dt);
    updateBlockDebris(dt);
    updateBGM();
    draw();
    requestAnimationFrame(loop);
  }

  function startGameplay(){
    resetGame();
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
